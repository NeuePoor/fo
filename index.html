<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="render" content="webkit">
<title>Foo</title>
<link id="favicon" rel="icon" type="image/webp" href="https://folio.neuepoor.com/favicon.webp">

<style>
/* ==========================================================================
   DYNAMIC DESIGN TOKENS (CSS VARIABLES)
   ========================================================================== */
:root {
    --fl-bg: #ffffff;
    --fl-text: #000000;
    --fl-gutter: 4px;
    --fl-margin: 4px;
    --fl-nav-h: 60px;
    --fl-nav-h-m: 44px;
    --fl-ease: cubic-bezier(0.23, 1, 0.32, 1);
    --fl-reveal-dist: 30px;
    --fl-reveal-dur: 1.2s;
    --fl-font-fallback: "Arial", "Helvetica", sans-serif;
    --splash-fs: 32px;
    --gallery-paragraph-spacing: 2.2em;
    
    /* 12栏网格中单栏宽度的流式动态测算公式 */
    --grid-col-width: calc((100vw - (var(--fl-margin) * 2) - (var(--fl-gutter) * 11)) / 12);
    
    /* Fallbacks for responsive component metrics */
    --cr-height: 105px;
    --st-height: 21px;
    --bg-height: 230px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --fl-bg: #000000;
        --fl-text: #ffffff;
    }
}

/* ==========================================================================
   GLOBAL RESET & CURSOR RULES
   ========================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
html, body { scrollbar-width: none; -ms-overflow-style: none; user-select: none; height: 100%; margin: 0; padding: 0; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

/* Pointer Logic */
@media (min-width: 769px) {
    body:not(.is-loading) { cursor: none; }
    body:not(.is-loading) a, 
    body:not(.is-loading) button, 
    body:not(.is-loading) img { cursor: none !important; }
}

body {
    font-family: var(--fl-font-fallback);
    background: var(--fl-bg);
    color: var(--fl-text);
    overflow-x: hidden;
    line-height: 1.4;
    transition: background-color 0.25s ease-out;
}

body.is-loading { overflow: hidden; }

/* ==========================================================================
   CUSTOM CURSOR
   ========================================================================= */
.fl-cursor {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 99999; mix-blend-mode: difference;
    opacity: 0; transition: opacity 0.5s ease; display: none;
}
@media (min-width: 769px) and (pointer: fine) {
    .fl-cursor { display: block; }
    body:not(.is-loading) .fl-cursor { opacity: 1; }
}
.fl-cursor__v, .fl-cursor__h { position: absolute; background: #fff; will-change: transform; }
.fl-cursor__v { width: 1px; height: 100vh; top: 0; left: 0; }
.fl-cursor__h { height: 1px; width: 100vw; left: 0; top: 0; }

/* ==========================================================================
   SPLASH LOAD SCREEN
   ========================================================================== */
.fl-splash {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 9999; display: flex; align-items: center; justify-content: center;
    background: var(--fl-bg); transition: background 1.2s var(--fl-ease);
}
.fl-splash__bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://folio.neuepoor.com/fo.gif') center/cover no-repeat;
    transition: filter 1.8s var(--fl-ease), opacity 1.8s var(--fl-ease), transform 1.8s var(--fl-ease);
    z-index: 1; opacity: 1;
}
.fl-splash__text {
    position: relative; z-index: 3;
    font-size: var(--splash-fs); font-weight: 700; color: #fff;
    mix-blend-mode: difference; opacity: 1; pointer-events: none;
    transition: opacity 0.5s var(--fl-ease);
}
.fl-splash.is-finished { pointer-events: none; background: transparent; z-index: 1; }
.fl-splash.is-finished .fl-splash__bg { filter: blur(40px); opacity: 1; transform: scale(1.1); }
.fl-splash.is-finished .fl-splash__text { opacity: 0 !important; visibility: hidden; }

/* ==========================================================================
   DECOUPLED LAYER 1: LANDING HERO MEDIA
   ========================================================================== */
.fl-landing-hero {
    position: fixed; z-index: 1001; pointer-events: none;
    overflow: hidden; opacity: 0; transform: translate3d(0,0,0);
    visibility: hidden;
    will-change: opacity, filter;
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease), visibility 0.4s var(--fl-ease);
}
.fl-landing-hero.is-active { pointer-events: auto; opacity: 1; visibility: visible; } 
.fl-landing-hero img { width: 100%; height: 100%; object-fit: cover; }

/* ==========================================================================
   DECOUPLED LAYER 2: LOGO INTERACTIVE TRIGGERS
   ========================================================================== */
.fl-logo__gif-wrap-pc { 
    position: fixed; top: 0; left: 4px; height: var(--fl-nav-h); 
    display: flex; align-items: center; z-index: 3001; 
    transition: transform 0.4s var(--fl-ease), opacity 0.6s var(--fl-ease); 
}
.fl-logo__gif-wrap-m { 
    display: none; 
}
.fl-logo__gif { height: var(--logo-size-pc); width: auto; opacity: 0; transition: opacity 0.3s var(--fl-ease); cursor: pointer; }

/* ==========================================================================
   DECOUPLED LAYER 3: MAIN NAVIGATION HEADER
   ========================================================================== */
.fl-header { 
    position: fixed; width: 100%; z-index: 3000; display: flex; 
    justify-content: space-between; align-items: center; padding: 0 4px; 
    height: var(--fl-nav-h); top: 0; 
    mix-blend-mode: difference;
    transition: transform 0.4s var(--fl-ease); 
}
.fl-logo-text { 
    text-decoration: none; 
    color: #fff; 
    font-size: var(--header-fs); 
    font-weight: var(--header-fw); 
    opacity: 0; 
    pointer-events: none; 
}
.fl-nav { display: flex; gap: 40px; }
.fl-nav__link { 
    font-size: var(--nav-fs); 
    font-weight: var(--header-fw); 
    color: #fff; 
    text-decoration: none; 
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease); 
}

/* ==========================================================================
   DECOUPLED LAYER 4: MOBILE EXCLUSIVE BACKGROUND CONTAINER
   ========================================================================== */
.fl-header__bg {
    display: none; 
}

/* ==========================================================================
   PAGE GRID LAYOUT
   ========================================================================== */
.fl-grid {
    position: relative; display: grid; grid-template-columns: repeat(12, 1fr);
    gap: var(--fl-gutter); margin: var(--fl-margin);
    min-height: calc(100vh - (var(--fl-margin) * 2)); 
    align-content: start; padding: 80px 0 100px; 
    z-index: 10; 
}
@media (min-width: 769px) {
    .fl-grid.is-intro { margin-top: 0px; } 
}

.fl-reveal { opacity: 0; transform: translateY(var(--fl-reveal-dist)); transition: opacity var(--fl-reveal-dur) var(--fl-ease), transform var(--fl-reveal-dur) var(--fl-ease), filter 0.6s var(--fl-ease); will-change: opacity, transform; }
.fl-reveal.is-visible { opacity: 1; transform: translateY(0); }

/* ==========================================================================
   GALLERY TYPOGRAPHY & FLUID WRAP ENGINE
   ========================================================================== */
.fl-gallery-text { 
    width: 100%; 
    max-width: 850px; /* 限制 PC 最大阅读行宽 */
    margin-bottom: 0; 
}

.fl-paragraph {
    font-size: clamp(var(--gallery-content-fs-m), 1vw + 13px, var(--gallery-content-fs));
    font-weight: var(--gallery-fw);
    color: var(--fl-text);
    line-height: 1.35;
    margin: 0 0 var(--gallery-paragraph-spacing) 0;
    
    /* 现代排版防撕裂机制 */
    text-wrap: pretty; /* 自动平衡每行字数，彻底消灭孤字换行 */
    word-break: break-word; /* 避免长单词撑破外壳 */
    -webkit-hyphens: auto;
    hyphens: auto; /* 在合适的位置自动加入断字符 */
}

.fl-paragraph:last-child {
    margin-bottom: 0;
}

/* ==========================================================================
   DECOUPLED LAYER 5: LOGO PANEL
   ========================================================================== */
.fl-logo-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; }
.fl-logo-panel.is-panel-pinned { pointer-events: auto; }

.fl-hero-special-text, .fl-contact-row {
    position: fixed; 
    opacity: 0; 
    filter: blur(15px); 
    pointer-events: none; 
    visibility: hidden; 
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease), visibility 0.4s var(--fl-ease);
}

/* Active Panel Triggers */
#ui-landing-hero.is-active ~ #ui-logo-panel .fl-hero-special-text,
#ui-landing-hero.is-active ~ #ui-logo-panel .fl-contact-row {
    opacity: 1; 
    filter: blur(0px); 
    pointer-events: auto;
    visibility: visible; 
}

.fl-hero-special-text { font-size: var(--special-text-fs); font-weight: var(--gallery-fw); color: var(--fl-text); white-space: nowrap; }
.fl-contact-row { display: flex; gap: 40px; align-items: center; }
.fl-gallery-link { font-size: var(--contact-fs); font-weight: var(--gallery-fw); color: var(--fl-text); text-decoration: none; transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease); }

/* ==========================================================================
   FOCUS INTERACTION SCHEME & DUAL-STATE PC FOCUS (DESKTOP ONLY)
   ========================================================================== */
@media (min-width: 769px) {
    .fl-nav__link, 
    .fl-logo__gif-wrap-pc, 
    .fl-reveal, 
    .fl-hero-special-text, 
    .fl-contact-row, 
    .fl-landing-hero {
        transition: opacity 0.6s var(--fl-ease), filter 0.6s var(--fl-ease), visibility 0.5s var(--fl-ease) !important;
    }

    /* STATE A: Panel NOT Active Focus Mode */
    body.has-focus-hover .fl-nav__link:not(.is-hovered-target),
    body.has-focus-hover .fl-logo__gif-wrap-pc:not(.is-hovered-target),
    body.has-focus-hover .fl-reveal:not(.is-hovered-target) {
        opacity: 0.2; 
        filter: blur(8px);
    }

    /* Keep grid background blurred while panel is active */
    #ui-landing-hero.is-active ~ #ui-main-grid .fl-reveal {
        opacity: 0.2;
        filter: blur(8px);
    }

    /* STATE B: Panel ACTIVE (Opened) Focus Mode */
    body.has-panel-focus-hover #ui-landing-hero:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-logo__gif-wrap-pc:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-nav__link:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-hero-special-text:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-gallery-link:not(.is-hovered-target) {
        opacity: 0.2 !important; 
        filter: blur(8px) !important;
    }

    body.has-panel-focus-hover .is-hovered-target {
        opacity: 1 !important;
        filter: blur(0px) !important;
    }
}

/* ==========================================================================
   WECHAT LAYER
   ========================================================================== */
.fl-wechat-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 11000; display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: 0.4s var(--fl-ease);
}
.fl-wechat-overlay.is-active { opacity: 1; visibility: visible; }
.fl-wechat-card { width: 320px; background: #fff; padding: 40px; text-align: center; }
.fl-wechat-qr { width: 100%; aspect-ratio: 1; margin-bottom: 24px; }
.fl-wechat-qr img { width: 100%; height: 100%; object-fit: contain; }

/* ==========================================================================
   MOBILE ECOSYSTEM (<= 768px Viewport)
   ========================================================================== */
@media (max-width: 768px) {
    /* PHYSICALLY KILL DESKTOP TRIGGERS */
    .fl-logo__gif-wrap-pc { display: none !important; }

    .fl-grid { padding: 4px 0 160px !important; margin-top: 0 !important; }
    
    .fl-gallery-text { width: 100% !important; max-width: 100% !important; }
    .fl-paragraph { 
        font-size: var(--gallery-content-fs-m) !important; 
        margin-bottom: 1.8em !important; 
    }
    .fl-paragraph:last-child {
        margin-bottom: 0 !important;
    }
    
    /* 1. MOBILE EXCLUSIVE BACKGROUND OVERLAY */
    .fl-header__bg {
        display: block;
        position: fixed;
        bottom: 24px;
        left: 32px;
        width: calc(100% - 64px);
        height: 44px;
        background: rgba(255, 255, 255, 0.2) !important; 
        backdrop-filter: blur(16px) saturate(160%) !important;
        -webkit-backdrop-filter: blur(16px) saturate(160%) !important;
        border: 0.5px solid rgba(0, 0, 0, 0.1) !important; 
        border-radius: 12px !important;
        z-index: 1000 !important;
        pointer-events: none;
        transition: height 0.6s var(--fl-ease), transform 0.4s var(--fl-ease) !important;
    }
    .fl-header__bg.is-expanded {
        height: var(--bg-height) !important;
    }

    @media (prefers-color-scheme: dark) {
        .fl-header__bg {
            background: rgba(28, 28, 30, 0.45) !important;
            border: 0.5px solid rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
        }
    }
    
    /* 2. MEDIA VISUAL LAYER (Driven dynamically by variables including configured offsets) */
    .fl-landing-hero {
        top: auto !important;
        left: auto !important;
        right: var(--hero-right-mb, 48px) !important;
        bottom: calc(var(--hero-bottom-base-mb, 80px) + (var(--cr-height) / 2) - (var(--hero-size-mb) / 2)) !important;
        width: var(--hero-size-mb) !important;
        height: var(--hero-size-mb) !important;
        transform: none !important;
        z-index: 1001 !important;
    }
    .fl-landing-hero img { border-radius: 8px !important; }
    
    /* 3. SCALABLE LABELS LAYER */
    .fl-logo-panel { z-index: 1004 !important; }
    .fl-hero-special-text {
        font-family: "Arial", sans-serif !important;
        font-size: var(--special-text-fs-m) !important;
        font-weight: 700 !important;
        line-height: 1 !important;
        width: calc(50% - 24px) !important;
        white-space: normal !important;
        top: auto !important;
        bottom: calc(80px + var(--cr-height) + 24px) !important;
        left: 48px !important;
        transform: none !important;
    }
    .fl-contact-row {
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 0px !important; 
        width: calc(50% - 24px) !important;
        top: auto !important;
        bottom: 80px !important;
        left: 48px !important;
        transform: none !important;
    }
    .fl-contact-row .fl-gallery-link {
        font-family: "Arial", sans-serif !important;
        font-size: var(--contact-fs-m) !important;
        font-weight: 700 !important;
        line-height: 1.05 !important; 
    }

    /* 4. STRUCTURAL NAV HEADER LAYER */
    .fl-header {
        top: auto !important; bottom: 24px !important; 
        left: 32px !important; width: calc(100% - 64px) !important;
        height: 44px !important; padding: 0 16px !important; border-radius: 12px !important;
        background: transparent !important; 
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: none !important; 
        z-index: 1005 !important; mix-blend-mode: normal !important;
        transition: transform 0.4s var(--fl-ease) !important;
    }
    
    /* 5. MOBILE EXCLUSIVE INTERACTIVE TRIGGER */
    .fl-logo__gif-wrap-m { 
        display: flex !important;
        position: fixed; 
        top: auto !important; 
        bottom: 24px !important; 
        left: 48px !important; 
        height: 44px !important; 
        align-items: center !important;
        z-index: 1006 !important; 
        transition: transform 0.4s var(--fl-ease), opacity 0.6s var(--fl-ease);
    }
    .fl-logo__gif-wrap-m .fl-logo__gif { height: 18px !important; opacity: 1 !important; }
    
    .fl-nav { 
        position: absolute !important;
        bottom: 0 !important;
        right: 16px !important;
        height: 44px !important;
        display: flex !important;
        align-items: center !important;
        gap: 20px !important; 
        z-index: 2;
    }
    .fl-nav__link { font-size: var(--nav-fs-m) !important; color: var(--fl-text) !important; opacity: 1 !important; filter: none !important; }
    .fl-logo-text { opacity: 0 !important; }

    /* HIDING BEHAVIORS */
    .fl-header.is-nav-hidden,
    .fl-logo__gif-wrap-m.is-nav-hidden,
    .fl-header__bg.is-nav-hidden,
    .fl-logo-panel.is-nav-hidden .fl-hero-special-text,
    .fl-logo-panel.is-nav-hidden .fl-contact-row,
    .fl-landing-hero.is-nav-hidden {
        transform: translateY(120px) !important;
    }
}
</style>
</head>

<script>
/* ==========================================================================
   APPLICATION CONFIGURATION
   ========================================================================== */
const CONFIG = {
    version: "Home 4.14.10",
    seo: { title: "Foo", favicon: "https://folio.neuepoor.com/favicon.webp" },
    splash: { text: "Folio", bg: "https://folio.neuepoor.com/fo.gif" },
    typography: {
        header: { font: "Arial, sans-serif", weight: "700", sizePC: "32px", sizeMobile: "21px" },
        nav: { sizePC: "32px", sizeMobile: "21px" }, 
        specialText: { sizePC: "32px", sizeMobile: "21px" }, 
        contact: { sizePC: "32px", sizeMobile: "21px" },

        }
    },
    header: {

        nav: [
            { name: 'Works', link: 'https://works.neuepoor.com' },
            { name: '(Play)', link: 'https://play.neuepoor.com' },
            { name: 'Me', link: 'https://Me.neuepoor.com' }
        ]
    },
    logoPanel: {

            { name: "Email", link: "mailto:poorleaglguy@qq.com" },
            { name: "Instagram", link: "https://www.instagram.com/neuepoor" },
            { name: "Github", link: "https://github.com/NeuePoor" },
            { name: "小红书", link: "https://xhslink.com/m/9qPnrun1Dh9" },
            { name: "WeChat", link: "#", isWeChat: true }
        ]
    },
    gallery: { 
        items: [{ 
            span: 12, 
            paragraphs: [
                "I'm a multi-disciplinary designer with focus on Graphic&Illustration,Creative Direction, Branding,Visual Identities, Packaging, Website, and Print& Editorial Design.",

                "Please contact me."
            ]
        }] 
    }
};

/* ==========================================================================
   APPLICATION ENGINE
   ========================================================================== */
const ENGINE = {
    lastWidth: window.innerWidth,
    lastIsMobile: window.innerWidth <= 768,
    lastHeight: window.innerHeight,
    
    isMobile() { 
        return window.innerWidth <= 768; 
    },
    
    initSEO() { 
        document.title = CONFIG.seo.title; 
        const f = document.getElementById('favicon'); 
        if (f) f.href = CONFIG.seo.favicon; 
    },
    
    applyTypography() {
        const r = document.documentElement; 
        const t = CONFIG.typography; 
        const h = CONFIG.heroImage;
        const l = CONFIG.header.logo;
        const p = { 
            '--header-font': t.header.font, 
            '--header-fw': t.header.weight, 
            '--header-fs': t.header.sizePC, 
            '--header-fs-m': t.header.sizeMobile, 
            '--nav-fs': t.nav.sizePC,
            '--nav-fs-m': t.nav.sizeMobile,
            '--special-text-fs': t.specialText.sizePC,
            '--special-text-fs-m': t.specialText.sizeMobile,
            '--contact-fs': t.contact.sizePC,
            '--contact-fs-m': t.contact.sizeMobile,
            '--gallery-content-fs': t.galleryContent.sizePC,
            '--gallery-content-fs-m': t.galleryContent.sizeMobile,
            '--gallery-font': t.gallery.font, 
            '--gallery-fw': t.gallery.weight, 
            '--gallery-fs': t.gallery.sizePC, 
            '--gallery-fs-m': t.gallery.sizeMobile, 
            '--logo-size-pc': l.sizePC, 
            '--logo-size-m': l.sizeMobile,
            
            // 将网格占比映射为 CSS 变量并进行流式计算
            '--hero-col-span-pc': h.colSpanPC,
            '--hero-col-span-mb': h.colSpanMobile,
            '--hero-size-pc': `calc(var(--hero-col-span-pc) * var(--grid-col-width) + (var(--hero-col-span-pc) - 1) * var(--fl-gutter))`,
            '--hero-size-mb': `calc(var(--hero-col-span-mb) * var(--grid-col-width) + (var(--hero-col-span-mb) - 1) * var(--fl-gutter))`,
            
            // 完美解耦：将 CONFIG 中的位置配置无缝传递给 CSS
            '--hero-top-pc': h.position.pc.top,
            '--hero-transform-pc': h.position.pc.transform,
            '--hero-right-mb': h.position.mobile.right,
            '--hero-bottom-base-mb': h.position.mobile.bottomBase
        };
        Object.entries(p).forEach(([k, v]) => r.style.setProperty(k, v));
    },
    
    renderHeader() {
        const gPC = document.getElementById('ui-logo-gif-pc');
        const gM = document.getElementById('ui-logo-gif-m');
        const t = document.getElementById('ui-logo-text');
        const n = document.getElementById('ui-nav');
        t.innerText = CONFIG.header.logo.text; 
        
        gPC.src = CONFIG.header.logo.gif;
        gM.src = CONFIG.header.logo.gif;
        
        gPC.onload = () => gPC.style.opacity = "1";
        gM.onload = () => gM.style.opacity = "1";
        
        n.innerHTML = CONFIG.header.nav.map(i => `<a href="${i.link}" class="fl-nav__link">${i.name}</a>`).join('');
    },
    
    renderLogoPanel() {
        const st = document.getElementById('ui-hero-special-text');
        const cr = document.getElementById('ui-contact-row');
        const hi = document.getElementById('ui-hero-img');
        hi.src = CONFIG.logoPanel.heroImg;
        st.innerText = CONFIG.logoPanel.specialText;
        cr.innerHTML = CONFIG.logoPanel.contact.map(l => `<a href="${l.link}" class="fl-gallery-link" ${l.isWeChat ? 'id="trigger-wechat"' : 'target="_blank"'}>${l.name}</a>`).join('');
        ENGINE.initWeChatTrigger();
    },
    
    buildContent() {
        const g = document.getElementById('ui-main-grid');
        g.innerHTML = CONFIG.gallery.items.map(i => {
            const paras = i.paragraphs.map(p => `<p class="fl-paragraph">${p}</p>`).join('');
            return `<div class="fl-item-wrapper fl-reveal" style="grid-column: span ${i.span || 12};"><div class="fl-gallery-text">${paras}</div></div>`;
        }).join('');
        ENGINE.initReveal();
    },
    
    /* ==========================================================================
       LOGICAL DECOUPLING: COMPLETE SEPARATION OF STATE MANAGEMENT
       ========================================================================== */
    resetAllStates() {
        const h = document.getElementById('ui-landing-hero');
        const p = document.getElementById('ui-logo-panel');
        const bg = document.getElementById('ui-header-bg');
        const b = document.body;
        
        if (h) {
            h.style.opacity = '0';
            h.classList.remove('is-active');
        }
        if (p) p.classList.remove('is-panel-pinned');
        if (bg) bg.classList.remove('is-expanded');
        
        b.classList.remove('is-pin-action', 'has-focus-hover', 'has-panel-focus-hover');
        document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
    },

    showHeroMobile() {
        const h = document.getElementById('ui-landing-hero');
        const p = document.getElementById('ui-logo-panel');
        const st = document.getElementById('ui-hero-special-text');
        const cr = document.getElementById('ui-contact-row');
        const bg = document.getElementById('ui-header-bg');
        
        const prevStTransform = st.style.transform;
        const prevCrTransform = cr.style.transform;
        st.style.transform = 'none';
        cr.style.transform = 'none';
        
        const origOpacity = st.style.opacity;
        const origVisibility = st.style.visibility;
        st.style.opacity = '0'; st.style.visibility = 'visible';
        cr.style.opacity = '0'; cr.style.visibility = 'visible';
        
        const stHeight = st.getBoundingClientRect().height || 21;
        const crHeight = cr.getBoundingClientRect().height || 105; 
        
        st.style.opacity = origOpacity; st.style.visibility = origVisibility;
        cr.style.opacity = origOpacity; cr.style.visibility = origVisibility;
        st.style.transform = prevStTransform; cr.style.transform = prevCrTransform;

        const r = document.documentElement;
        r.style.setProperty('--cr-height', `${crHeight}px`);
        r.style.setProperty('--st-height', `${stHeight}px`);
        r.style.setProperty('--bg-height', `${24 + stHeight + 24 + crHeight + 56}px`);

        p.classList.add('is-panel-pinned');
        if (bg) bg.classList.add('is-expanded');
        
        h.style.opacity = "1"; 
        h.classList.add('is-active');
    },

    showHeroPC(isPin = false) {
        const h = document.getElementById('ui-landing-hero');
        const p = document.getElementById('ui-logo-panel');
        const st = document.getElementById('ui-hero-special-text');
        const cr = document.getElementById('ui-contact-row');
        const b = document.body;

        h.style.width = 'var(--hero-size-pc)'; 
        h.style.height = 'var(--hero-size-pc)';
        h.style.top = 'var(--hero-top-pc)'; 
        
        // 动态读取 CONFIG 配置的电脑端网格锚定列
        const u = window.innerWidth / 12; 
        const anchorCol = CONFIG.heroImage.position.pc.anchorColumn;
        h.style.left = `${u * anchorCol}px`; 
        h.style.right = 'auto'; h.style.bottom = 'auto';
        h.style.transform = 'var(--hero-transform-pc)';
        
        st.style.left = '4px'; st.style.top = '50%'; st.style.bottom = 'auto';
        st.style.transform = 'translateY(-50%)';
        cr.style.left = '4px'; cr.style.bottom = '12px'; cr.style.top = 'auto'; 
        cr.style.transform = 'none';
        
        if (isPin) {
            p.classList.add('is-panel-pinned');
            b.classList.add('is-pin-action');
        }
        h.style.opacity = "1"; 
        h.classList.add('is-active');
    },

    hideHero() {
        ENGINE.resetAllStates();
    },

    initTriggersAndInteractions() {
        const p = document.getElementById('ui-logo-panel');
        const hero = document.getElementById('ui-landing-hero');
        
        const lwPC = document.getElementById('ui-logo-gif-wrap-pc');
        const gPC = document.getElementById('ui-logo-gif-pc');
        
        if (lwPC && gPC) {
            lwPC.onmouseenter = () => {
                if (!ENGINE.isMobile() && !p.classList.contains('is-panel-pinned')) {
                    ENGINE.showHeroPC(false);
                }
            };
            lwPC.onmouseleave = () => {
                if (!ENGINE.isMobile() && !p.classList.contains('is-panel-pinned')) {
                    ENGINE.hideHero();
                }
            };
            gPC.onclick = (e) => {
                e.stopPropagation();
                if (ENGINE.isMobile()) return; 
                
                if (hero.classList.contains('is-active') && p.classList.contains('is-panel-pinned')) {
                    ENGINE.hideHero();
                } else {
                    ENGINE.showHeroPC(true);
                }
            };
        }

        const lwM = document.getElementById('ui-logo-gif-wrap-m');
        const gM = document.getElementById('ui-logo-gif-m');
        
        if (lwM && gM) {
            gM.onclick = (e) => {
                e.stopPropagation();
                if (!ENGINE.isMobile()) return; 
                
                if (hero.classList.contains('is-active')) {
                    ENGINE.hideHero();
                } else {
                    ENGINE.showHeroMobile();
                }
            };
        }

        if (p) {
            p.onclick = (e) => {
                if (e.target === p && p.classList.contains('is-panel-pinned')) {
                    ENGINE.hideHero();
                }
            };
        }
    },
    
    initSplash() {
        const s = document.getElementById('ui-splash');
        const st = document.getElementById('ui-splash-text');
        const sb = document.getElementById('ui-splash-bg');
        const b = document.body;
        st.innerText = CONFIG.splash.text;
        sb.style.backgroundImage = `url(${CONFIG.splash.bg})`;
        const d = () => {
            if (!b.classList.contains('is-loading')) return;
            s.classList.add('is-finished'); 
            b.classList.remove('is-loading');
            sessionStorage.setItem('fl_visited', 'true');
        };
        if (sessionStorage.getItem('fl_visited')) {
            b.classList.remove('is-loading'); 
            s.classList.add('is-finished');
            return;
        }
        setTimeout(d, 1800); 
        s.onclick = d;
    },
    
    initFocusMode() {
        if (ENGINE.isMobile()) return;
        
        const b = document.body; 
        const hero = document.getElementById('ui-landing-hero');
        
        const selectorA = '.fl-nav__link, .fl-logo__gif-wrap-pc, .fl-reveal';
        const selectorB = '.fl-nav__link, .fl-logo__gif-wrap-pc, #ui-landing-hero, #ui-hero-special-text, .fl-gallery-link';

        document.addEventListener('mouseover', (e) => { 
            if (b.classList.contains('is-loading') || ENGINE.isMobile()) return;
            
            const isPanelActive = hero && hero.classList.contains('is-active');
            
            if (isPanelActive) {
                const target = e.target.closest(selectorB);
                if (target) {
                    document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
                    b.classList.remove('has-focus-hover');
                    b.classList.add('has-panel-focus-hover');
                    target.classList.add('is-hovered-target');
                }
            } else {
                const target = e.target.closest(selectorA);
                if (target) {
                    document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
                    b.classList.remove('has-panel-focus-hover');
                    b.classList.add('has-focus-hover');
                    target.classList.add('is-hovered-target');
                }
            }
        });

        document.addEventListener('mouseout', (e) => { 
            if (b.classList.contains('is-loading') || ENGINE.isMobile()) return;
            
            const isPanelActive = hero && hero.classList.contains('is-active');
            const activeSelector = isPanelActive ? selectorB : selectorA;
            
            if (!e.relatedTarget || !e.relatedTarget.closest(activeSelector)) {
                b.classList.remove('has-focus-hover', 'has-panel-focus-hover');
                document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
            }
        });
    },
    
    initCustomCursor() {
        if (ENGINE.isMobile()) return;
        const v = document.getElementById('ui-cursor-v'); 
        const h = document.getElementById('ui-cursor-h');
        window.addEventListener('mousemove', (e) => {
            if (document.body.classList.contains('is-loading')) return;
            requestAnimationFrame(() => { 
                v.style.transform = `translate3d(${e.clientX}px, 0, 0)`; 
                h.style.transform = `translate3d(0, ${e.clientY}px, 0)`; 
            });
        }, { passive: true });
    },
    
    initScrollInteraction() {
        const h = document.getElementById('ui-header'); 
        const lwM = document.getElementById('ui-logo-gif-wrap-m'); 
        const bg = document.getElementById('ui-header-bg');
        const lp = document.getElementById('ui-logo-panel');
        const lh = document.getElementById('ui-landing-hero');
        let timer;
        window.addEventListener('scroll', () => {
            if (ENGINE.isMobile()) {
                if (lh && lh.classList.contains('is-active')) return;

                h.classList.add('is-nav-hidden'); 
                if (lwM) lwM.classList.add('is-nav-hidden');
                if (bg) bg.classList.add('is-nav-hidden');
                if (lp) lp.classList.add('is-nav-hidden');
                if (lh) lh.classList.add('is-nav-hidden');

                clearTimeout(timer); 
                timer = setTimeout(() => { 
                    h.classList.remove('is-nav-hidden'); 
                    if (lwM) lwM.classList.remove('is-nav-hidden'); 
                    if (bg) bg.classList.remove('is-nav-hidden');
                    if (lp) lp.classList.remove('is-nav-hidden');
                    if (lh) lh.classList.remove('is-nav-hidden');
                }, 250);
            }
        }, { passive: true });
    },
    
    initReveal() {
        const o = new IntersectionObserver((es) => es.forEach(e => { 
            if (e.isIntersecting) { 
                e.target.classList.add('is-visible'); 
                o.unobserve(e.target); 
            } 
        }), { threshold: 0.05 });
        document.querySelectorAll('.fl-reveal').forEach(el => o.observe(el));
    },
    
    initWeChatTrigger() {
        const t = document.getElementById('trigger-wechat'); 
        const o = document.getElementById('ui-wechat-overlay');
        if (t && o) { 
            t.onclick = (e) => { 
                e.preventDefault(); 
                o.classList.add('is-active'); 
            }; 
            o.onclick = () => o.classList.remove('is-active'); 
        }
    },
    
    start() {
        ENGINE.initSEO(); 
        ENGINE.applyTypography(); 
        ENGINE.renderHeader(); 
        ENGINE.renderLogoPanel();
        ENGINE.buildContent(); 
        ENGINE.initFocusMode(); 
        ENGINE.initCustomCursor();
        ENGINE.initScrollInteraction(); 
        ENGINE.initTriggersAndInteractions(); 
        ENGINE.initSplash();
        
        window.addEventListener('resize', () => {
            const currentIsMobile = ENGINE.isMobile();
            const widthChanged = Math.abs(window.innerWidth - ENGINE.lastWidth) > 5;
            const heightChanged = window.innerHeight !== ENGINE.lastHeight;
            
            if (currentIsMobile !== ENGINE.lastIsMobile) {
                ENGINE.lastIsMobile = currentIsMobile;
                ENGINE.lastWidth = window.innerWidth;
                ENGINE.lastHeight = window.innerHeight;
                
                ENGINE.resetAllStates();
                ENGINE.buildContent();
                return;
            }
            
            if (widthChanged) {
                ENGINE.lastWidth = window.innerWidth;
                ENGINE.buildContent();
                if (!ENGINE.isMobile()) {
                    const h = document.getElementById('ui-landing-hero');
                    const p = document.getElementById('ui-logo-panel');
                    if (h && h.classList.contains('is-active') && p.classList.contains('is-panel-pinned')) {
                        ENGINE.showHeroPC(true);
                    }
                }
            } else if (heightChanged && ENGINE.isMobile()) {
                const h = document.getElementById('ui-landing-hero');
                if (h && h.classList.contains('is-active')) {
                    ENGINE.showHeroMobile();
                }
            }
            ENGINE.lastHeight = window.innerHeight;
        }, { passive: true });
    }
};

window.onload = () => ENGINE.start();
</script>
</body>
</html>
