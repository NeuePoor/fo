<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 
  Folio Portfolio Navigation - Professional Engineering Edition
  Optimizations:
  - Atomic CSS Variables for full control
  - High-performance Hardware Acceleration Management
  - DRY (Don't Repeat Yourself) JS Logic
  - Robust Video-to-Text Fallback
-->
<title>Folio</title>
<link id="favicon" rel="icon" type="image/webp" href="https://folio.neuepoor.com/Favicon.webp">
<style>
  :root {
    /* 核心配置 */
    --bg: #fff; --text: #000;
    --gutter: 4px; --margin: 4px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    
    /* 导航配置 */
    --nav-h: 60px; --nav-fs: 32px; --m-nav-fs: 21px;
    --m-nav-bg: rgba(255, 255, 255, 0.65);
    
    /* 动效参数 */
    --reveal-dist: 20px; --reveal-dur: 0.8s;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --text: #fff; --m-nav-bg: rgba(28, 28, 30, 0.75); }
  }

  * { box-sizing: border-box; }
  html, body { 
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility; overflow-x: hidden;
  }

  /* --- 动效核心 --- */
  .reveal-item {
    opacity: 0;
    transform: translateY(var(--reveal-dist));
    transition: opacity var(--reveal-dur) var(--ease), transform var(--reveal-dur) var(--ease);
    will-change: transform, opacity;
  }
  .reveal-item.is-visible {
    opacity: 1; transform: translateY(0);
    will-change: auto; /* 动画结束后释放合成层，确保字体清晰 */
  }

  /* --- 布局系统 --- */
  .main-grid {
    display: grid; grid-template-columns: repeat(12, 1fr);
    gap: var(--gutter); margin: var(--margin);
    padding: 80px 0 120px;
  }

  .item-full { grid-column: span 12; }
  .item-wide { grid-column: span 8; }
  .item-narrow { grid-column: span 4; }
  .item-qtr { grid-column: span 3; }
  
  .info-col { font-size: 10px; line-height: 1.4; opacity: 0.8; margin-bottom: 20px; }
  .info-col b { display: block; margin-bottom: 4.2em; font-weight: normal; }

  .grid-box {
    height: 45vh; border-radius: 4px; display: flex;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    color: rgba(255,255,255,0.9);
  }

  /* --- 响应式布局 --- */
  @media (max-width: 768px) {
    .main-grid { padding-top: 20px; }
    [class*="item-"], .col-1, .col-2, .col-3 { grid-column: span 12; }
    .info-col { margin-bottom: 12px; }
  }

  .col-1 { grid-column: span 6; } .col-2 { grid-column: span 4; } .col-3 { grid-column: span 2; }

  /* --- 导航控制 --- */
  .nav {
    position: fixed; width: 100%; display: flex; justify-content: space-between;
    align-items: center; padding: 0 4px; z-index: 99; height: var(--nav-h);
  }

  @media (min-width: 769px) {
    .nav { top: 0; mix-blend-mode: difference; color: #fff; }
    .logo-v { filter: invert(1); }
    @media (prefers-color-scheme: dark) { .logo-v { filter: none; } }
  }

  @media (max-width: 768px) {
    .nav {
      bottom: 12px; height: 30px; padding: 0 16px; left: 12px;
      width: calc(100% - 24px); border-radius: 15px;
      background: var(--m-nav-bg); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); border: 0.5px solid rgba(0,0,0,0.1);
    }
  }

  .logo-wrap { height: 48px; display: flex; align-items: center; cursor: pointer; text-decoration: none; color: inherit; }
  .logo-v { height: 100%; display: none; }
  .logo-t { font-weight: 700; font-size: var(--nav-fs); letter-spacing: -0.05em; }

  .links { display: flex; gap: 40px; }
  .links a { text-decoration: none; color: inherit; font-size: var(--nav-fs); font-weight: 700; transition: opacity 0.3s; }
  .links a:hover { opacity: 0.3; }

  @media (max-width: 768px) {
    .links { gap: 16px; }
    .links a { font-size: var(--m-nav-fs); }
    .logo-wrap { height: 18px; }
    .logo-t { font-size: var(--m-nav-fs); }
  }
</style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="logo-wrap" id="logo">
      <video class="logo-v" id="v" autoplay loop muted playsinline preload="auto">
        <source src="https://folio.neuepoor.com/head_chrome.webm" type="video/webm">
        <source src="https://folio.neuepoor.com/head_safari.mov" type='video/mp4; codecs="hvc1"'>
      </video>
      <span class="logo-t" id="t">Fo</span>
    </a>
    <div class="links" id="ls">
      <!-- 动态注入 -->
    </div>
  </nav>

  <main class="main-grid">
    <div class="info-col col-1 reveal-item"><b>Works</b>Branding<br>Vision identity<br>Look Book<br>Interface<br>Packaging<br>Editorial<br>Apparel</div>
    <div class="info-col col-2 reveal-item"><b>Service</b>Creative Direction<br>Art Direction<br>Graphic<br>Illustration<br>Motion<br>Typeface</div>
    <div class="info-col col-3 reveal-item"><b>Contacts</b>Email<br>Instagram<br>Github<br>小红书<br>Wechat</div>

    <div class="grid-box item-full reveal-item" style="background:#007aff">Full</div>
    <div class="grid-box item-wide reveal-item" style="background:#ff2d55">Wide</div>
    <div class="grid-box item-narrow reveal-item" style="background:#5856d6">Narrow</div>
    <div class="grid-box item-qtr reveal-item" style="background:#ff9500">Q1</div>
    <div class="grid-box item-qtr reveal-item" style="background:#34c759">Q2</div>
    <div class="grid-box item-qtr reveal-item" style="background:#5ac8fa">Q3</div>
    <div class="grid-box item-qtr reveal-item" style="background:#ffcc00;color:#000">Q4</div>
  </main>

  <script>
    const CONFIG = {
      nav: [
        { t: 'Works', u: '#work' },
        { t: '(Play)', u: '#play' },
        { t: 'Me', u: '/me' }
      ]
    };

    const init = () => {
      const v = document.getElementById('v'), t = document.getElementById('t'), ls = document.getElementById('ls');

      // 1. 极简导航渲染
      ls.innerHTML = CONFIG.nav.map(n => `<a href="${n.u}">${n.t}</a>`).join('');

      // 2. 健壮的视频加载逻辑
      v.oncanplay = () => { v.style.display = 'block'; t.style.display = 'none'; };
      v.onerror = () => { v.style.display = 'none'; t.style.display = 'block'; };

      // 3. 高性能单次触发 Observer
      const observer = new IntersectionObserver((recs) => {
        recs.forEach(r => {
          if (r.isIntersecting) {
            r.target.classList.add('is-visible');
            observer.unobserve(r.target);
          }
        });
      }, { threshold: 0.15 });

      document.querySelectorAll('.reveal-item').forEach(el => observer.observe(el));
    };

    window.onload = init;
  </script>
</body>
</html>
