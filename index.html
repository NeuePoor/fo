<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 
  项目名称: Folio Portfolio Navigation
  版本号: v4.7.0
  更新说明: 
  1. 将页面的上下左右边距（Margin）统一调整为 4px。
  2. 保持 PC 12栏/手机 4栏的 Grid 布局系统。
  3. 保持 4px 的槽宽（Gutter）以实现完全对齐的视觉效果。
-->
<title>Folio</title>
<link id="dynamicFavicon" rel="icon" type="image/webp" href="https://folio.neuepoor.com/Favicon.webp">
<style>
  /* ==============================================
      【设计规范与变量】
     ==============================================
  */
  :root {
    --site-title: "Fo";
    --site-favicon: "https://folio.neuepoor.com/Favicon.webp";

    --bg-color: #ffffff;
    --pc-text-color: #ffffff; 
    
    /* Grid 系统变量 - 统一为 4px */
    --grid-gutter: 4px;
    --grid-margin: 4px;
    --desktop-cols: 12;
    --mobile-cols: 4;

    /* 移动端材质变量 (SwiftUI Style) */
    --m-nav-bg: rgba(255, 255, 255, 0.65);
    --m-nav-border: rgba(0, 0, 0, 0.08);
    --m-nav-text: rgba(0, 0, 0, 0.85);
    --m-blur: 20px;

    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    
    --logo-font-size: 32px;
    --logo-font-weight: 700;
    --mobile-logo-font-size: 21px;

    --nav-font-size: 32px;
    --nav-font-weight: 700;
    --mobile-nav-font-size: 21px;

    /* Logo 资源 */
    --logo-video-webm: "https://folio.neuepoor.com/head_chrome.webm"; 
    --logo-video-mp4: "https://folio.neuepoor.com/head_safari.mov";   
    --logo-height: 48px;          
    --logo-text: "Fo";             
    --mobile-logo-text: "Fo";      
    --mobile-logo-height: 18px;   

    --nav-link-1-text: "Works";   
    --nav-link-1-url: "#work";    
    --nav-link-2-text: "(Play)";  
    --nav-link-2-url: "#play";    
    --nav-link-3-text: "Me";      
    --nav-link-3-url: "/me";      

    --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);  
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #000000;
      --m-nav-bg: rgba(28, 28, 30, 0.75);
      --m-nav-border: rgba(255, 255, 255, 0.15);
      --m-nav-text: rgba(255, 255, 255, 0.95);
    }
  }

  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-family);
    background-color: var(--bg-color); 
    color: var(--pc-text-color);
    -webkit-font-smoothing: antialiased;
  }

  /* ==============================================
      【Grid 布局系统】
     ==============================================
  */

  .main-grid {
    display: grid;
    /* 上下左右边距统一调整为 4px */
    margin: var(--grid-margin);
    column-gap: var(--grid-gutter);
    row-gap: var(--grid-gutter);
    /* 顶部预留足够空间避开导航栏文字 */
    padding-top: 80px; 
    padding-bottom: 120px; 
  }

  @media (min-width: 769px) {
    .main-grid {
      grid-template-columns: repeat(var(--desktop-cols), 1fr);
    }
    .item-full { grid-column: span 12; }
    .item-wide { grid-column: span 8; }
    .item-narrow { grid-column: span 4; }
    .item-quarter { grid-column: span 3; }
  }

  @media (max-width: 768px) {
    .main-grid {
      grid-template-columns: repeat(var(--mobile-cols), 1fr);
      padding-top: 40px;
    }
    .item-full, .item-wide, .item-narrow, .item-quarter {
      grid-column: span 4; 
    }
    .item-half-m { grid-column: span 2; } 
  }

  .grid-box {
    height: 45vh;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
  }

  /* ==============================================
      【导航栏样式】
     ==============================================
  */
  .custom-nav {
    position: fixed; width: 100%; display: flex; justify-content: space-between; align-items: center; 
    /* 导航栏左右 padding 也调整为 12px 以保持文字呼吸感，如果需要严格对齐 4px 可调整此值 */
    padding: var(--vertical-padding) 12px; box-sizing: border-box; z-index: 4000;
  }

  @media (min-width: 769px) {
    .custom-nav { top: 0; background: transparent; mix-blend-mode: difference; }
    .logo-video { filter: invert(1); }
    @media (prefers-color-scheme: dark) { .logo-video { filter: invert(0); } }
  }

  @media (max-width: 768px) {
    .custom-nav {
      top: auto; bottom: 34px; height: 30px; padding: 0 16px;
      background: var(--m-nav-bg); 
      backdrop-filter: blur(var(--m-blur)) saturate(180%); 
      -webkit-backdrop-filter: blur(var(--m-blur)) saturate(180%);
      border-radius: 15px; width: calc(100% - 24px); left: 12px;
      color: var(--m-nav-text); 
      border: 0.5px solid var(--m-nav-border); 
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      mix-blend-mode: normal;
    }
    .logo-video { filter: none !important; }
  }

  .logo-container, .nav-links { display: flex; align-items: center; text-decoration: none; color: inherit; }
  .logo-container { height: var(--logo-height); cursor: pointer; user-select: none; }
  .logo-video { height: 100%; width: auto; display: none; object-fit: contain; background: transparent; }
  .logo-fallback { font-weight: var(--logo-font-weight); font-size: var(--logo-font-size); letter-spacing: -0.05em; line-height: 1; }

  .nav-links { display: flex; gap: 40px; }
  .nav-links a { text-decoration: none; color: inherit; font-size: var(--nav-font-size); font-weight: var(--nav-font-weight); transition: var(--transition); }
  .nav-links a:hover { opacity: 0.3; }

  @media (max-width: 768px) {
    .nav-links { gap: 16px; }
    .nav-links a { font-size: var(--mobile-nav-font-size); }
    .logo-container { height: var(--mobile-logo-height); }
    .logo-fallback { font-size: var(--mobile-logo-font-size); }
  }
</style>
</head>
<body>

  <nav class="custom-nav">
    <div class="logo-container" id="logoLink">
      <video class="logo-video" id="logoVid" autoplay loop muted playsinline webkit-playsinline preload="auto">
        <source id="srcMp4" type='video/mp4; codecs="hvc1"'> 
        <source id="srcWebm" type="video/webm">
      </video>
      <span class="logo-fallback" id="fallbackText"></span>
    </div>
    
    <div class="nav-links">
      <a href="#" id="nav1"></a>
      <a href="#" id="nav2"></a>
      <a href="#" id="nav3"></a>
    </div>
  </nav>

  <!-- 基于 4px 边距的网格内容区域 -->
  <main class="main-grid">
    <div class="grid-box item-full" style="background-color: #007aff;">Blue Block (Full)</div>
    <div class="grid-box item-wide" style="background-color: #ff2d55;">Pink Block (8 Cols)</div>
    <div class="grid-box item-narrow" style="background-color: #5856d6;">Indigo Block (4 Cols)</div>
    <div class="grid-box item-quarter" style="background-color: #ff9500;">Orange</div>
    <div class="grid-box item-quarter" style="background-color: #34c759;">Green</div>
    <div class="grid-box item-quarter" style="background-color: #5ac8fa;">Sky</div>
    <div class="grid-box item-quarter" style="background-color: #ffcc00; color: #000;">Yellow</div>
    <div class="grid-box item-half-m" style="background-color: #1c1c1e;">Dark Gray</div>
    <div class="grid-box item-half-m" style="background-color: #f2f2f7; color: #000;">Light Gray</div>
  </main>

  <script>
    function init() {
      const root = document.documentElement;
      const getVar = (name) => getComputedStyle(root).getPropertyValue(name).trim().replace(/^"(.*)"$/, '$1');
      
      document.title = getVar('--site-title');
      const favicon = document.getElementById('dynamicFavicon') || document.createElement('link');
      favicon.id = 'dynamicFavicon'; favicon.rel = 'icon';
      favicon.href = getVar('--site-favicon');
      if (!document.getElementById('dynamicFavicon')) document.head.appendChild(favicon);

      const video = document.getElementById('logoVid');
      const fallback = document.getElementById('fallbackText');
      const srcMp4 = document.getElementById('srcMp4');
      const srcWebm = document.getElementById('srcWebm');

      srcMp4.src = getVar('--logo-video-mp4');
      srcWebm.src = getVar('--logo-video-webm');
      
      video.load();
      video.oncanplay = () => {
        video.style.display = 'block';
        fallback.style.display = 'none';
      };
      video.onerror = () => {
        video.style.display = 'none';
        fallback.style.display = 'block';
      };

      const updateLogoText = () => {
        const isMobile = window.innerWidth <= 768;
        fallback.textContent = isMobile ? getVar('--mobile-logo-text') : getVar('--logo-text');
      };
      
      updateLogoText();
      
      const navItems = [
        {id:'nav1',v:'--nav-link-1-text',u:'--nav-link-1-url'},
        {id:'nav2',v:'--nav-link-2-text',u:'--nav-link-2-url'},
        {id:'nav3',v:'--nav-link-3-text',u:'--nav-link-3-url'}
      ];
      
      navItems.forEach(item => {
        const el = document.getElementById(item.id);
        if (el) { 
          el.textContent = getVar(item.v); 
          el.href = getVar(item.u); 
        }
      });

      window.addEventListener('resize', updateLogoText);
    }
    
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
