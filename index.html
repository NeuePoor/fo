<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="render" content="webkit">
<title>Foo</title>
<link id="favicon" rel="icon" type="image/webp" href="https://folio.neuepoor.com/favicon.webp">

<style>
/* ==========================================================================
BASE CSS & DYNAMIC TOKENS
========================================================================== */
:root {
--fl-bg: #ffffff;
--fl-text: #000000;
--fl-gutter: 4px;
--fl-margin: 4px;
--fl-nav-h: 60px;
--fl-ease: cubic-bezier(0.23, 1, 0.32, 1);
--fl-reveal-dist: 30px;
--fl-reveal-dur: 1.2s;
--fl-font-fallback: "Arial", "Helvetica", sans-serif;
--grid-color: rgba(0, 0, 0, 0.08);
--grid-square-color: rgba(0, 0, 0, 0.3);
--splash-fs: 32px;
--gallery-paragraph-spacing: 2.2em;
--intro-margin: 70vh; 
--full-height: 100vh;
}

@supports (height: 100dvh) {
    :root { --full-height: 100dvh; }
}

@media (prefers-color-scheme: dark) {
:root {
--fl-bg: #000000;
--fl-text: #ffffff;
--grid-color: rgba(255, 255, 255, 0.08);
--grid-square-color: rgba(255, 255, 255, 0.3);
}
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

/* v4.12.16: Release all viewport locks for natural mobile scrolling */
html { 
    background-color: var(--fl-bg);
    margin: 0; padding: 0;
    width: 100%;
    /* No fixed height here */
}

body {
    margin: 0; padding: 0;
    width: 100%;
    font-family: var(--fl-font-fallback);
    background: var(--fl-bg);
    color: var(--fl-text);
    overflow-x: hidden;
    line-height: 1.4;
    /* Ensure system momentum scrolling */
    -webkit-overflow-scrolling: touch;
    transition: background-color 0.25s ease-out;
}

/* Hide scrollbars */
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
body { scrollbar-width: none; -ms-overflow-style: none; }

/* PC Cursor logic stays same */
@media (min-width: 769px) {
    body:not(.is-loading) { cursor: none; }
    body:not(.is-loading) a, body:not(.is-loading) button, body:not(.is-loading) img { cursor: none !important; }
}

/* Loading state: Only lock when splash is active */
body.is-loading { overflow: hidden; height: 100vh; position: fixed; width: 100%; }

/* GLOBAL DECORATION GRID & BG GIF (The Patch) */
.fl-global-grid, .fl-splash__bg {
    position: fixed; 
    /* v4.12.16 Patch: Ultra-stretch to hide browser UI bar gaps */
    top: -200px; 
    bottom: -200px; 
    left: -200px; 
    right: -200px; 
    pointer-events: none; 
    will-change: transform, opacity;
}

.fl-global-grid {
    z-index: 2; 
    opacity: 0;
    transition: opacity 2s var(--fl-ease);
    background-repeat: repeat;
}
body:not(.is-loading) .fl-global-grid { opacity: 1; }

/* SPLASH */
.fl-splash {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 9999; display: flex; align-items: center; justify-content: center;
    background: var(--fl-bg); transition: background 1.2s var(--fl-ease);
}
.fl-splash__bg {
    background: url('https://folio.neuepoor.com/fo.gif') center/cover no-repeat;
    transition: filter 1.8s var(--fl-ease), opacity 1.8s var(--fl-ease), transform 1.8s var(--fl-ease);
    z-index: 1; opacity: 1;
}
.fl-splash__text {
    position: relative; z-index: 3;
    font-size: var(--splash-fs); font-weight: 700; color: #fff;
    mix-blend-mode: difference; opacity: 1;
}
.fl-splash.is-finished { pointer-events: none; background: transparent; z-index: 1; }
.fl-splash.is-finished .fl-splash__bg { filter: blur(40px); transform: scale(1.1); }
.fl-splash.is-finished .fl-splash__text { opacity: 0; visibility: hidden; }

/* LOGO & NAV */
.fl-logo__gif-wrap { position: fixed; top: 0; left: 4px; height: var(--fl-nav-h); display: flex; align-items: center; z-index: 1001; transition: transform 0.4s var(--fl-ease), opacity 0.6s var(--fl-ease); }
.fl-logo__gif { height: var(--logo-size-pc); width: auto; opacity: 0; transition: opacity 0.3s var(--fl-ease); cursor: pointer; }
.fl-header { position: fixed; width: 100%; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; height: var(--fl-nav-h); top: 0; mix-blend-mode: difference; }
.fl-nav { display: flex; gap: 40px; }
.fl-nav__link { font-size: var(--header-fs); font-weight: var(--header-fw); color: #fff; text-decoration: none; transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease); }

/* MAIN GRID CONTENT */
.fl-grid {
    position: relative; 
    display: grid; 
    grid-template-columns: repeat(12, 1fr);
    gap: var(--fl-gutter); 
    margin: var(--fl-margin);
    z-index: 5; 
    pointer-events: none; 
    padding-top: 80px;
}
@media (min-width: 769px) {
    .fl-grid { min-height: calc(var(--full-height) - 8px); align-content: end; }
    .fl-grid.is-intro { margin-top: var(--intro-margin); transition: margin-top 0.8s var(--fl-ease); }
}
.fl-grid > * { pointer-events: auto; }

/* ITEM STYLES */
.fl-reveal {
    opacity: 0; 
    transform: translateY(var(--fl-reveal-dist));
    transition: opacity var(--fl-reveal-dur) var(--fl-ease), transform var(--fl-reveal-dur) var(--fl-ease);
}
.fl-reveal.is-visible { opacity: 1; transform: translateY(0); }

.fl-item-wrapper { position: relative; display: flex; flex-direction: column; }
.fl-gallery-text { 
    font-size: var(--gallery-fs); 
    font-weight: var(--gallery-fw); 
    color: var(--fl-text); 
    line-height: 1.15; 
    margin-bottom: var(--gallery-paragraph-spacing);
    width: clamp(320px, 75%, 850px); 
    max-width: 100%;
    text-wrap: wrap; 
}

/* CONTACT */
.fl-footer-contact { grid-column: span 12; margin-top: 2em; padding-bottom: 20px; }
.fl-contact-row { display: flex; gap: 40px; align-items: center; }
.fl-gallery-link { font-size: var(--gallery-fs); font-weight: var(--gallery-fw); color: var(--fl-text); text-decoration: none; transition: 0.4s; }

/* MOBILE ADAPTATION | v4.12.16: Focus on "Unbound" Scrolling */
@media (max-width: 768px) {
    body.is-loading { height: 100%; position: fixed; } /* Lock only during splash */
    
    .fl-grid {
        display: block !important; 
        margin: 16px !important;
        padding-top: 20px !important;
        /* Force height to be content-driven */
        min-height: auto !important;
        /* Large bottom padding to ensure scroll feels "deep" and natural */
        padding-bottom: 180px !important; 
    }

    .fl-item-wrapper { margin-bottom: 32px; }
    .fl-gallery-text { width: 100%; font-size: var(--gallery-fs-m); }
    
    .fl-header {
        top: auto !important; bottom: 32px !important; left: 32px !important; width: calc(100% - 64px) !important;
        height: 44px !important; padding: 0 16px !important; border-radius: 12px !important;
        mix-blend-mode: normal !important; 
        background: rgba(255, 255, 255, 0.25) !important;
        backdrop-filter: blur(20px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
        border: 0.5px solid rgba(0, 0, 0, 0.1) !important;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) { .fl-header { background: rgba(28, 28, 30, 0.5) !important; border-color: rgba(255, 255, 255, 0.1) !important; } }
    
    .fl-logo__gif-wrap { top: auto !important; bottom: 32px !important; left: 48px !important; height: 44px !important; mix-blend-mode: normal; }
    .fl-logo__gif { height: 20px !important; opacity: 1 !important; }
    .fl-nav__link { font-size: 14px !important; color: var(--fl-text) !important; }
    .is-nav-hidden { transform: translateY(120px) !important; }
}

/* PC Cursor & Special Text */
.fl-cursor { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99999; mix-blend-mode: difference; display: none; }
@media (min-width: 769px) { .fl-cursor { display: block; } }
.fl-cursor__v { width: 1px; height: 100vh; background: #fff; position: absolute; }
.fl-cursor__h { height: 1px; width: 100vw; background: #fff; position: absolute; }
</style>
</head>
<body class="is-loading">

<div class="fl-cursor" id="ui-cursor">
    <div class="fl-cursor__v" id="ui-cursor-v"></div>
    <div class="fl-cursor__h" id="ui-cursor-h"></div>
</div>

<!-- Global Grid: Ultra-stretched for Mobile -->
<div class="fl-global-grid" id="ui-grid-wrapper"></div>

<!-- Splash: Fixed cover -->
<div class="fl-splash" id="ui-splash">
    <div class="fl-splash__bg" id="ui-splash-bg"></div>
    <div class="fl-splash__text" id="ui-splash-text"></div>
</div>

<div class="fl-logo__gif-wrap" id="ui-logo-gif-wrap">
    <img class="fl-logo__gif" id="ui-logo-gif" alt="Logo">
</div>

<header class="fl-header" id="ui-header">
    <div style="width: 32px;"></div> <!-- Spacer for Logo -->
    <nav class="fl-nav" id="ui-nav"></nav>
</header>

<main class="fl-grid is-intro" id="ui-main-grid">
    <!-- Content injected here -->
    <footer class="fl-footer-contact fl-reveal" id="ui-footer-contact"></footer>
</main>

<script>
const CONFIG = {
    splash: { text: "Folio", bg: "https://folio.neuepoor.com/fo.gif" },
    header: {
        logo: { gif: "https://folio.neuepoor.com/logo.gif", sizePC: "32px", sizeM: "20px" },
        nav: [
            { name: 'Works', link: 'https://works.neuepoor.com' },
            { name: '(Play)', link: 'https://play.neuepoor.com' },
            { name: 'Me', link: 'https://Me.neuepoor.com' }
        ]
    },
    gallery: [
        { span: 12, content: "I'm a multi-disciplinary designer with focus on Graphic&Illustration,Creative Direction, Branding,Visual Identities, Packaging, Website, and Print& Editorial Design.<br><br>If you are looking for a designer who excles in BrandStrategy/Visual Direction/Print Works/Products/IP/Curatorial/Grid Layout/Website design/Typeface Customization.<br><br>Please contact me." }
    ],
    contact: [
        { name: "Email", link: "mailto:poorleaglguy@qq.com" },
        { name: "Instagram", link: "https://www.instagram.com/neuepoor" },
        { name: "Github", link: "https://github.com/NeuePoor" },
        { name: "WeChat", link: "#" }
    ]
};

const APP = {
    isMobile: () => window.innerWidth <= 768,
    
    init() {
        this.applyStyles();
        this.render();
        this.initSplash();
        this.initScroll();
        if (!this.isMobile()) this.initCursor();
        this.drawGrid();
        this.initReveal();
    },

    applyStyles() {
        const root = document.documentElement;
        root.style.setProperty('--header-fw', '700');
        root.style.setProperty('--header-fs', '32px');
        root.style.setProperty('--gallery-fw', '700');
        root.style.setProperty('--gallery-fs', '32px');
        root.style.setProperty('--gallery-fs-m', '21px');
        root.style.setProperty('--logo-size-pc', CONFIG.header.logo.sizePC);
    },

    render() {
        // Logo
        const logo = document.getElementById('ui-logo-gif');
        logo.src = CONFIG.header.logo.gif;
        logo.onload = () => logo.style.opacity = 1;

        // Nav
        const nav = document.getElementById('ui-nav');
        nav.innerHTML = CONFIG.header.nav.map(n => `<a href="${n.link}" class="fl-nav__link">${n.name}</a>`).join('');

        // Grid Content
        const grid = document.getElementById('ui-main-grid');
        const footer = document.getElementById('ui-footer-contact');
        let html = CONFIG.gallery.map(item => `
            <div class="fl-item-wrapper fl-reveal" style="grid-column: span ${item.span}">
                <div class="fl-gallery-text">${item.content}</div>
            </div>
        `).join('');
        grid.insertAdjacentHTML('afterbegin', html);

        // Contact
        footer.innerHTML = `<div class="fl-contact-row">${CONFIG.contact.map(c => `<a href="${c.link}" class="fl-gallery-link">${c.name}</a>`).join('')}</div>`;
    },

    initSplash() {
        const splash = document.getElementById('ui-splash');
        const splashBg = document.getElementById('ui-splash-bg');
        const splashText = document.getElementById('ui-splash-text');
        
        splashText.innerText = CONFIG.splash.text;
        splashBg.style.backgroundImage = `url(${CONFIG.splash.bg})`;

        const dismiss = () => {
            splash.classList.add('is-finished');
            document.body.classList.remove('is-loading');
            // Patch: Manually ensure body is unlocked
            document.body.style.position = 'static';
            document.body.style.overflow = 'visible';
            document.body.style.height = 'auto';
        };

        const visited = sessionStorage.getItem('v3_visited');
        if (visited) {
            dismiss();
        } else {
            setTimeout(dismiss, 2800);
            sessionStorage.setItem('v3_visited', 'true');
        }
    },

    initScroll() {
        const header = document.getElementById('ui-header');
        const logo = document.getElementById('ui-logo-gif-wrap');
        let lastPos = 0;
        let timer;

        window.addEventListener('scroll', () => {
            if (!this.isMobile()) return;
            
            header.classList.add('is-nav-hidden');
            logo.classList.add('is-nav-hidden');
            
            clearTimeout(timer);
            timer = setTimeout(() => {
                header.classList.remove('is-nav-hidden');
                logo.classList.remove('is-nav-hidden');
            }, 200);
        }, { passive: true });
    },

    initCursor() {
        const v = document.getElementById('ui-cursor-v');
        const h = document.getElementById('ui-cursor-h');
        window.addEventListener('mousemove', (e) => {
            v.style.transform = `translateX(${e.clientX}px)`;
            h.style.transform = `translateY(${e.clientY}px)`;
        });
    },

    drawGrid() {
        const wrapper = document.getElementById('ui-grid-wrapper');
        const canvas = document.createElement('canvas');
        const size = 60;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-color');
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0,0); ctx.lineTo(size,0);
        ctx.moveTo(0,0); ctx.lineTo(0,size);
        ctx.stroke();
        
        wrapper.style.backgroundImage = `url(${canvas.toDataURL()})`;
    },

    initReveal() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('is-visible') });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fl-reveal').forEach(el => observer.observe(el));
    }
};

window.onload = () => APP.init();
</script>

</body>
</html>
