<style>
/* ==========================================================================
   [1] 全局基础与重置 (BASE & RESET)
   ========================================================================== */
:root {
    --fl-bg: #ffffff;
    --fl-text: #000000;
    --fl-gutter: 4px;
    --fl-margin: 4px;
    --fl-nav-h: 60px;
    --fl-nav-h-m: 44px;
    --fl-ease: cubic-bezier(0.23, 1, 0.32, 1);
    --fl-font-fallback: "Arial", "Helvetica", sans-serif;
    --cr-height: 105px;
    --st-height: 21px;
    --bg-height: 230px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --fl-bg: #000000;
        --fl-text: #ffffff;
    }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

html, body { scrollbar-width: none; -ms-overflow-style: none; user-select: none; height: 100%; margin: 0; padding: 0; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

@media (min-width: 769px) {
    body:not(.is-loading) { cursor: none; }
    body:not(.is-loading) a, 
    body:not(.is-loading) button, 
    body:not(.is-loading) img,
    body:not(.is-loading) video { cursor: none !important; }
}

body {
    font-family: var(--fl-font-fallback);
    background: var(--fl-bg);
    color: var(--fl-text);
    overflow-x: hidden;
    line-height: 1.4;
    transition: background-color 0.25s ease-out;
}

body.is-loading { overflow: hidden; }

.fl-cursor {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 99999; mix-blend-mode: difference;
    opacity: 0; transition: opacity 0.5s ease; display: none;
}
@media (min-width: 769px) and (pointer: fine) {
    .fl-cursor { display: block; }
    body:not(.is-loading) .fl-cursor { opacity: 1; }
}
.fl-cursor__v, .fl-cursor__h { position: absolute; background: #fff; will-change: transform; }
.fl-cursor__v { width: 1px; height: 100vh; height: 100dvh; top: 0; left: 0; }
.fl-cursor__h { height: 1px; width: 100vw; left: 0; top: 0; }

#ui-splash, #ui-main-grid, #ui-landing-hero {
    isolation: isolate;
}

/* ==========================================================================
   ⬇️⬇️⬇️ [2] 全局通用组件：HEADER & LOGO PANEL (全站复制粘贴区) ⬇️⬇️⬇️
   ========================================================================== */

.fl-header { 
    position: fixed; width: 100%; z-index: 3000; display: flex; 
    justify-content: space-between; align-items: center; padding: 0 4px; 
    height: var(--fl-nav-h); top: 0; 
    mix-blend-mode: difference;
    transition: transform 0.4s var(--fl-ease); 
}
.fl-header__bg { display: none; }

.fl-logo-text { 
    text-decoration: none; color: #fff; 
    font-size: var(--header-fs); font-weight: var(--header-fw); 
    opacity: 0; cursor: pointer; pointer-events: auto; 
    transition: opacity 0.3s var(--fl-ease);
}
.fl-logo-text.is-replaced {
    visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
}

.fl-nav { display: flex; gap: 40px; }
.fl-nav__link { 
    font-size: var(--nav-fs); font-weight: var(--header-fw); 
    color: #fff; text-decoration: none; 
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease); 
}

.fl-logo__gif-wrap-pc { 
    position: fixed; top: 0; left: 4px; height: var(--fl-nav-h); 
    display: flex; align-items: center; z-index: 3001; 
    transition: transform 0.4s var(--fl-ease), opacity 0.6s var(--fl-ease); 
    cursor: pointer;
}
.fl-logo__gif-wrap-pc::before {
    content: ''; position: absolute;
    top: -12px; bottom: -12px; left: -4px; right: -24px;
}
.fl-logo__gif-wrap-m { display: none; }
.fl-logo__gif { height: var(--logo-size-pc); width: auto; opacity: 0; transition: opacity 0.3s var(--fl-ease); }

.fl-logo-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; }
.fl-logo-panel.is-panel-pinned { pointer-events: auto; }

.fl-landing-hero {
    position: fixed; z-index: 2001; pointer-events: none;
    overflow: hidden; opacity: 0; transform: translate3d(0,0,0);
    visibility: hidden; will-change: opacity, filter, transform;
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease), visibility 0.4s var(--fl-ease), transform 0.4s var(--fl-ease);
}
.fl-landing-hero.is-active { pointer-events: auto; opacity: 1; visibility: visible; } 
.fl-landing-hero img { width: 100%; height: 100%; object-fit: cover; }

.fl-hero-special-text, .fl-contact-row, .fl-close-btn {
    position: fixed; opacity: 0; filter: blur(15px); pointer-events: none; visibility: hidden; 
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease), visibility 0.4s var(--fl-ease), transform 0.4s var(--fl-ease);
}
#ui-landing-hero.is-active ~ #ui-logo-panel .fl-hero-special-text,
#ui-landing-hero.is-active ~ #ui-logo-panel .fl-contact-row,
#ui-landing-hero.is-active ~ #ui-logo-panel .fl-close-btn {
    opacity: 1; filter: blur(0px); pointer-events: auto; visibility: visible; 
}

.fl-hero-special-text { font-size: var(--special-text-fs); font-weight: var(--gallery-fw); color: var(--fl-text); white-space: nowrap; }
.fl-contact-row { display: flex; gap: 40px; align-items: center; }
.fl-gallery-link { font-size: var(--contact-fs); font-weight: var(--gallery-fw); color: var(--fl-text); text-decoration: none; transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease); }
.fl-close-btn { position: absolute; right: 24px; bottom: 12px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--fl-text); }

.fl-wechat-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 11000; display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: 0.4s var(--fl-ease);
}
.fl-wechat-overlay.is-active { opacity: 1; visibility: visible; }
.fl-wechat-card { width: 320px; background: #fff; padding: 40px; text-align: center; color: #000; }
.fl-wechat-qr { width: 100%; aspect-ratio: 1; margin: 0 auto 24px auto; }
.fl-wechat-qr img { width: 100%; height: 100%; object-fit: contain; }

@media (min-width: 769px) {
    /* 核心修改：渲染层级解耦，PC 端彻底屏蔽 Hero Image 与 Special Text 的绘制，同时保留 DOM 结构以维持后续兄弟节点（Contact）的动画触发链 */
    #ui-landing-hero,
    #ui-hero-special-text {
        display: none !important;
    }

    .fl-nav__link, .fl-logo__gif-wrap-pc, .fl-hero-special-text, .fl-contact-row, .fl-close-btn, .fl-landing-hero, .fl-logo-text { transition: opacity 0.6s var(--fl-ease), filter 0.6s var(--fl-ease), visibility 0.5s var(--fl-ease) !important; }
    
    body.has-focus-hover .fl-nav__link:not(.is-hovered-target),
    body.has-focus-hover .fl-logo__gif-wrap-pc:not(.is-hovered-target),
    body.has-focus-hover .fl-logo-text:not(.is-hovered-target) { opacity: 0.2; filter: blur(8px); }

    body.has-panel-focus-hover #ui-landing-hero:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-logo__gif-wrap-pc:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-logo-text:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-nav__link:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-hero-special-text:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-gallery-link:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-close-btn:not(.is-hovered-target) { opacity: 0.2 !important; filter: blur(8px) !important; }

    body.has-panel-focus-hover .is-hovered-target { opacity: 1 !important; filter: blur(0px) !important; }
    
    /* 核心修改：渲染层彻底解耦，在 PC 环境下将移动端专属节点直接抹杀 */
    #ui-splash-bg-m { display: none !important; }
}

@media (max-width: 768px) {
    .fl-logo__gif-wrap-pc { display: none !important; }
    
    .fl-header__bg {
        display: block; position: fixed; bottom: 24px; left: 32px; width: calc(100% - 64px); height: 44px; 
        background: rgba(255, 255, 255, 0.2) !important; backdrop-filter: blur(16px) saturate(160%) !important;
        border: 0.5px solid rgba(0, 0, 0, 0.1) !important; border-radius: 12px !important;
        z-index: 1000 !important; pointer-events: none;
        transition: height 0.4s var(--fl-ease), transform 0.4s var(--fl-ease), opacity 0.4s var(--fl-ease) !important;
    }
    .fl-header__bg.is-expanded { height: var(--bg-height) !important; }
    @media (prefers-color-scheme: dark) {
        .fl-header__bg { background: rgba(28, 28, 30, 0.45) !important; border: 0.5px solid rgba(255, 255, 255, 0.1) !important; }
    }
    
    .fl-landing-hero {
        top: auto !important; left: auto !important; right: var(--hero-right-mb, 48px) !important;
        bottom: calc(var(--hero-bottom-base-mb, 80px) + (var(--cr-height) / 2) - (var(--hero-size-mb) / 2)) !important;
        width: var(--hero-size-mb) !important; height: var(--hero-size-mb) !important;
        transform: none !important; z-index: 1001 !important;
    }
    .fl-landing-hero img { border-radius: 8px !important; }
    
    .fl-logo-panel { z-index: 1004 !important; transition: transform 0.4s var(--fl-ease), opacity 0.4s var(--fl-ease) !important; }
    .fl-close-btn { top: auto !important; bottom: calc(var(--bg-height) - 24px) !important; right: 48px !important; }

    .fl-hero-special-text {
        font-family: "Arial", sans-serif !important; font-size: var(--special-text-fs-m) !important;
        font-weight: 700 !important; line-height: 1 !important; width: calc(50% - 24px) !important;
        white-space: normal !important; top: auto !important; bottom: calc(80px + var(--cr-height) + 24px) !important;
        left: 48px !important; transform: none !important;
    }
    .fl-contact-row {
        display: flex !important; flex-direction: column !important; align-items: flex-start !important;
        gap: 0px !important; width: calc(50% - 24px) !important; top: auto !important;
        bottom: 80px !important; left: 48px !important; transform: none !important;
    }
    .fl-contact-row .fl-gallery-link { font-family: "Arial", sans-serif !important; font-size: var(--contact-fs-m) !important; font-weight: 700 !important; line-height: 1.05 !important; }

    .fl-header {
        top: auto !important; bottom: 24px !important; left: 32px !important; width: calc(100% - 64px) !important;
        height: 44px !important; padding: 0 16px !important; border-radius: 12px !important;
        background: transparent !important; backdrop-filter: none !important; border: none !important; 
        z-index: 1005 !important; mix-blend-mode: normal !important;
        transition: transform 0.4s var(--fl-ease), opacity 0.4s var(--fl-ease) !important;
    }
    
    .fl-logo__gif-wrap-m { 
        display: flex !important; position: fixed; top: auto !important; bottom: 24px !important; 
        left: 48px !important; height: 44px !important; align-items: center !important;
        z-index: 1006 !important; 
        transition: transform 0.4s var(--fl-ease), opacity 0.4s var(--fl-ease) !important;
        cursor: pointer;
    }
    .fl-logo__gif-wrap-m::before {
        content: ''; position: absolute;
        top: -16px; bottom: -16px; left: -16px; right: -24px;
    }
    .fl-logo__gif-wrap-m .fl-logo__gif { height: 18px !important; opacity: 1 !important; }
    
    .fl-nav { 
        position: absolute !important; bottom: 0 !important; right: 16px !important;
        height: 44px !important; display: flex !important; align-items: center !important; gap: 20px !important; 
    }
    .fl-nav__link { font-size: var(--nav-fs-m) !important; color: var(--fl-text) !important; opacity: 1 !important; filter: none !important; }
    
    body .is-nav-hidden { opacity: 0 !important; transform: translateY(16px) scale(0.8) translateZ(0) !important; pointer-events: none !important; }
    
    /* 核心修改：渲染层彻底解耦，在移动环境下将 PC 端专属 WebM 节点直接抹杀 */
    #ui-splash-bg-pc { display: none !important; }
}

body.is-low-perf .fl-header__bg { backdrop-filter: none !important; background: rgba(255, 255, 255, 0.95) !important; }
@media (prefers-color-scheme: dark) { body.is-low-perf .fl-header__bg { background: rgba(28, 28, 30, 0.95) !important; } }
body.is-low-perf .fl-hero-special-text, body.is-low-perf .fl-contact-row, body.is-low-perf .fl-close-btn { filter: none !important; }
body.is-low-perf .fl-wechat-overlay { backdrop-filter: none !important; background: rgba(0, 0, 0, 0.95) !important; }

/* ==========================================================================
   ⬆️⬆️⬆️ 全局通用组件 结束 ⬆️⬆️⬆️
   ========================================================================== */


/* ==========================================================================

   ========================================================================== */
:root {
    --splash-fs: 32px;
    --gallery-paragraph-spacing: 2.2em;
    --splash-dur: 1.2s;
    --fl-reveal-dist: 30px;
    --fl-reveal-dur: 1.2s;
    --grid-col-width: calc((100vw - (var(--fl-margin) * 2) - (var(--fl-gutter) * 11)) / 12);
}

.fl-splash {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; z-index: 9999; 
    display: flex; align-items: center; justify-content: center; background: var(--fl-bg); 
    transition: opacity var(--splash-dur) var(--fl-ease), visibility var(--splash-dur) var(--fl-ease), background var(--splash-dur) var(--fl-ease);
    overflow: hidden;
    touch-action: none; 
    overscroll-behavior: none;
}

.fl-splash__bg {
    position: absolute !important; top: 0 !important; left: 0 !important;
    width: 100% !important; height: 100% !important;
    display: block !important;
    object-fit: cover !important; 
    transition: opacity var(--splash-dur) var(--fl-ease), transform var(--splash-dur) var(--fl-ease);
    z-index: 1; opacity: 1;
    will-change: transform, opacity;
}

.fl-splash__text {
    position: relative; z-index: 3; font-size: var(--splash-fs); font-weight: 700; color: #fff;
    mix-blend-mode: difference; opacity: 1; pointer-events: none; transition: opacity 0.5s var(--fl-ease);
    transform: translateZ(0); will-change: opacity, transform;
}

.fl-splash.is-finished { opacity: 0 !important; visibility: hidden !important; pointer-events: none; z-index: 1; }

.fl-grid {
    position: relative; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: var(--fl-gutter); margin: var(--fl-margin);
    min-height: calc(100vh - (var(--fl-margin) * 2)); 
    align-content: start; padding: 80px 0 100px; z-index: 10; 
}

.fl-reveal { opacity: 0; transform: translateY(var(--fl-reveal-dist)); transition: opacity var(--fl-reveal-dur) var(--fl-ease), transform var(--fl-reveal-dur) var(--fl-ease); }
.fl-reveal.is-visible { opacity: 1; transform: translateY(0); }

.fl-item-wrapper { min-width: 0; }

.fl-gallery-text { width: 100%; max-width: 850px; margin-bottom: 0; }
.fl-paragraph {
    font-size: clamp(var(--gallery-content-fs-m), 1vw + 13px, var(--gallery-content-fs));
    font-weight: var(--gallery-fw); color: var(--fl-text); line-height: 1.35;
    margin: 0 0 var(--gallery-paragraph-spacing) 0; text-wrap: pretty; word-break: break-word; -webkit-hyphens: auto; hyphens: auto; 
}
.fl-paragraph:last-child { margin-bottom: 0; }

@media (min-width: 769px) {
    .fl-grid.is-intro { padding-top: calc(100vh - 280px); } 
    .fl-gallery-text { max-width: 100% !important; }
    .fl-reveal { --fl-reveal-dist: 100px; transition: opacity var(--fl-reveal-dur) var(--fl-ease), transform var(--fl-reveal-dur) var(--fl-ease), filter 0.6s var(--fl-ease) !important; }
    body.has-focus-hover .fl-reveal:not(.is-hovered-target) { opacity: 0.2; filter: blur(8px); }
    #ui-landing-hero.is-active ~ #ui-main-grid .fl-reveal { opacity: 0.2; filter: blur(8px); }
}

@media (max-width: 768px) {
    /* 核心修复：彻底废弃 absolute 定位，强行固化在视口顶层，无视一切历史滚动恢复行为 */
    .fl-splash { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; }
    .fl-splash__bg { object-position: center calc(50% + 56px) !important; }
    
    .fl-grid { padding: 4px 0 160px !important; margin-top: 0 !important; min-height: 200vh !important; }
    .fl-gallery-text { width: 100% !important; max-width: 100% !important; }
    .fl-paragraph { font-size: var(--gallery-content-fs-m) !important; margin-bottom: 1.8em !important; }
    .fl-paragraph:last-child { margin-bottom: 0 !important; }
}

        contact: [
            { name: "Email", link: "mailto:poorleaglguy@qq.com" },
            { name: "Instagram", link: "https://www.instagram.com/neuepoor" },
            { name: "Github", link: "https://github.com/NeuePoor" },
            { name: "小红书", link: "https://xhslink.com/m/9qPnrun1Dh9" },
            { name: "WeChat", link: "#", isWeChat: true, qrText: "WeChat: NeuePoor", svgSize: "100%" }
        ],
        contactStyles: { sizePC: "21px", sizeMobile: "clamp(10px, 5vw, 12px)" }
    }
};

const ENGINE = {
    lastWidth: window.innerWidth,
    lastIsMobile: window.innerWidth <= 768,
    lastHeight: window.innerHeight,
    
    revealObserver: null, 
    
    isMobile() { return window.innerWidth <= 768; },

    initSEO() { 
        document.title = CONFIG_GLOBAL.seo.title; 
        const f = document.getElementById('favicon'); if (f) f.href = CONFIG_GLOBAL.seo.favicon; 
    },

    initPerformanceMode() {
        const mode = CONFIG_GLOBAL.performance?.mode || 'high';
        if (mode === 'high') return; 
        if (mode === 'low' || (mode === 'auto' && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
            document.body.classList.add('is-low-perf');
        }
    },

    applyGlobalTypography() {
        const r = document.documentElement; const c = CONFIG_GLOBAL;
        const p = { 
            '--header-font': c.header.logo.font, '--header-fw': c.header.logo.weight, 
            '--header-fs': c.header.logo.sizePC, '--header-fs-m': c.header.logo.sizeMobile, 
            '--nav-fs': c.header.nav[0].sizePC, '--nav-fs-m': c.header.nav[0].sizeMobile,
            '--special-text-fs': c.logoPanel.specialText.sizePC, '--special-text-fs-m': c.logoPanel.specialText.sizeMobile,
            '--contact-fs': c.logoPanel.contactStyles.sizePC, '--contact-fs-m': c.logoPanel.contactStyles.sizeMobile,
            '--logo-size-pc': c.header.logo.sizePC, '--logo-size-m': c.header.logo.sizeMobile,
            ...(typeof CONFIG_PAGE !== 'undefined' && CONFIG_PAGE.heroImage ? {
                '--hero-col-span-pc': CONFIG_PAGE.heroImage.colSpanPC, '--hero-col-span-mb': CONFIG_PAGE.heroImage.colSpanMobile,
                '--hero-size-pc': `calc(var(--hero-col-span-pc) * var(--grid-col-width) + (var(--hero-col-span-pc) - 1) * var(--fl-gutter))`,
                '--hero-size-mb': `calc(var(--hero-col-span-mb) * var(--grid-col-width) + (var(--hero-col-span-mb) - 1) * var(--fl-gutter))`,
                '--hero-top-pc': CONFIG_PAGE.heroImage.position.pc.top, '--hero-transform-pc': CONFIG_PAGE.heroImage.position.pc.transform,
                '--hero-right-mb': CONFIG_PAGE.heroImage.position.mobile.right, '--hero-bottom-base-mb': CONFIG_PAGE.heroImage.position.mobile.bottomBase
            } : {})
        };
        Object.entries(p).forEach(([k, v]) => r.style.setProperty(k, v));
    },
    
    renderHeader() {
        const gPC = document.getElementById('ui-logo-gif-pc'); const gM = document.getElementById('ui-logo-gif-m');
        const t = document.getElementById('ui-logo-text'); const n = document.getElementById('ui-nav');
        if(!gPC || !n) return;
        t.innerText = CONFIG_GLOBAL.header.logo.text; 
        gPC.src = CONFIG_GLOBAL.header.logo.gif; gM.src = CONFIG_GLOBAL.header.logo.gif;
        gPC.onload = () => { gPC.style.opacity = "1"; t.classList.add('is-replaced'); };
        gM.onload = () => { gM.style.opacity = "1"; t.classList.add('is-replaced'); };
        n.innerHTML = CONFIG_GLOBAL.header.nav.map(i => `<a href="${i.link}" class="fl-nav__link">${i.name}</a>`).join('');
    },
    
    renderLogoPanel() {
        const st = document.getElementById('ui-hero-special-text'); const cr = document.getElementById('ui-contact-row');
        const hi = document.getElementById('ui-hero-img');
        if(!st || !cr) return;
        hi.src = CONFIG_GLOBAL.logoPanel.heroImg; st.innerText = CONFIG_GLOBAL.logoPanel.specialText.text;
        
        const wechatConfig = CONFIG_GLOBAL.logoPanel.contact.find(l => l.isWeChat);
        if (wechatConfig) {
            const wId = document.getElementById('ui-wechat-id'); const wQr = document.getElementById('ui-wechat-qr');
            if (wId && wechatConfig.qrText) wId.innerText = wechatConfig.qrText;
            if (wQr && wechatConfig.svgSize) wQr.style.width = wechatConfig.svgSize;
        }
        cr.innerHTML = CONFIG_GLOBAL.logoPanel.contact.map(l => `<a href="${l.link}" class="fl-gallery-link" ${l.isWeChat ? 'id="trigger-wechat"' : 'target="_blank"'}>${l.name}</a>`).join('');
        ENGINE.initWeChatTrigger();
    },
    
    resetAllStates() {
        const h = document.getElementById('ui-landing-hero'); const p = document.getElementById('ui-logo-panel');
        const bg = document.getElementById('ui-header-bg'); const b = document.body;
        if (h) { h.style.opacity = '0'; h.classList.remove('is-active'); }
        if (p) p.classList.remove('is-panel-pinned');
        if (bg) bg.classList.remove('is-expanded');
        b.classList.remove('is-pin-action', 'has-focus-hover', 'has-panel-focus-hover');
        document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
    },

    showHeroMobile() {
        const h = document.getElementById('ui-landing-hero'); const p = document.getElementById('ui-logo-panel');
        const st = document.getElementById('ui-hero-special-text'); const cr = document.getElementById('ui-contact-row');
        const bg = document.getElementById('ui-header-bg');
        if(!h || !p) return;
        const stHeight = st.getBoundingClientRect().height || 21; const crHeight = cr.getBoundingClientRect().height || 105; 
        document.documentElement.style.setProperty('--cr-height', `${crHeight}px`);
        document.documentElement.style.setProperty('--bg-height', `${24 + stHeight + 24 + crHeight + 56}px`);
        p.classList.add('is-panel-pinned'); if (bg) bg.classList.add('is-expanded');
        h.style.opacity = "1"; h.classList.add('is-active');
    },

    showHeroPC(isPin = false) {
        const h = document.getElementById('ui-landing-hero');
        const p = document.getElementById('ui-logo-panel');
        const cr = document.getElementById('ui-contact-row');
        if(!h || !p) return;

        // 核心修改：业务逻辑层解耦。PC 端彻底剥离对于 HeroImg 的尺寸注入和定位计算，仅维护 Contact 区域并发送激活信号
        cr.style.left = '4px'; 
        cr.style.bottom = '12px';
        
        if (isPin) { p.classList.add('is-panel-pinned'); document.body.classList.add('is-pin-action'); }
        // 维持赋予激活类名，以触发 Contact 组件的展开动效
        h.classList.add('is-active');
    },

    hideHero() { ENGINE.resetAllStates(); },

    initTriggersAndInteractions() {
        const p = document.getElementById('ui-logo-panel'); const hero = document.getElementById('ui-landing-hero');
        const lwPC = document.getElementById('ui-logo-gif-wrap-pc');
        const lwM = document.getElementById('ui-logo-gif-wrap-m');
        const closeBtn = document.getElementById('ui-close-btn'); const navContainer = document.getElementById('ui-nav');
        const tLogo = document.getElementById('ui-logo-text'); 
        if(!p || !hero) return;

        if (lwPC) {
            lwPC.onmouseenter = () => { if (window.innerWidth > 768 && !p.classList.contains('is-panel-pinned')) ENGINE.showHeroPC(false); };
            lwPC.onmouseleave = () => { if (window.innerWidth > 768 && !p.classList.contains('is-panel-pinned')) ENGINE.hideHero(); };
            lwPC.onclick = (e) => { e.stopPropagation(); if (window.innerWidth <= 768) return; if (hero.classList.contains('is-active') && p.classList.contains('is-panel-pinned')) ENGINE.hideHero(); else ENGINE.showHeroPC(true); };
        }
        
        if (tLogo) {
            tLogo.onmouseenter = () => { if (window.innerWidth > 768 && !p.classList.contains('is-panel-pinned')) ENGINE.showHeroPC(false); };
            tLogo.onmouseleave = () => { if (window.innerWidth > 768 && !p.classList.contains('is-panel-pinned')) ENGINE.hideHero(); };
            tLogo.onclick = (e) => { 
                e.preventDefault(); e.stopPropagation(); 
                if (window.innerWidth <= 768) { if (hero.classList.contains('is-active')) ENGINE.hideHero(); else ENGINE.showHeroMobile(); } 
                else { if (hero.classList.contains('is-active') && p.classList.contains('is-panel-pinned')) ENGINE.hideHero(); else ENGINE.showHeroPC(true); }
            };
        }

        if (lwM) { 
            lwM.onclick = (e) => { e.stopPropagation(); if (window.innerWidth > 768) return; if (hero.classList.contains('is-active')) ENGINE.hideHero(); else ENGINE.showHeroMobile(); }; 
        }
        
        if (p) { p.onclick = (e) => { if (e.target === p && p.classList.contains('is-panel-pinned')) ENGINE.hideHero(); }; }
        if (closeBtn) { closeBtn.onclick = (e) => { e.stopPropagation(); ENGINE.hideHero(); }; }

        if (navContainer) {
            navContainer.addEventListener('click', (e) => {
                const link = e.target.closest('.fl-nav__link'); if (!link) return; 
                if (ENGINE.isMobile() && p.classList.contains('is-panel-pinned')) {
                    e.preventDefault(); const targetHref = link.href; ENGINE.hideHero();  
                    setTimeout(() => { window.location.href = targetHref; }, 400);
                }
            });
        }
    },
    
    initGlobalFocusMode() {
        if (window.innerWidth <= 768) return;
        const b = document.body; const hero = document.getElementById('ui-landing-hero');
        const selA = '.fl-nav__link, .fl-logo__gif-wrap-pc, .fl-logo-text, .fl-reveal'; 
        const selB = '.fl-nav__link, .fl-logo__gif-wrap-pc, .fl-logo-text, #ui-landing-hero, #ui-hero-special-text, .fl-gallery-link, .fl-close-btn';
        document.addEventListener('mouseover', (e) => { 
            if (b.classList.contains('is-loading') || window.innerWidth <= 768) return;
            const isPanelActive = hero && hero.classList.contains('is-active');
            const target = e.target.closest(isPanelActive ? selB : selA);
            if (target) {
                document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
                b.classList.remove('has-focus-hover', 'has-panel-focus-hover');
                b.classList.add(isPanelActive ? 'has-panel-focus-hover' : 'has-focus-hover');
                target.classList.add('is-hovered-target');
            }
        });
        document.addEventListener('mouseout', (e) => { 
            if (b.classList.contains('is-loading') || window.innerWidth <= 768) return;
            const activeSel = (hero && hero.classList.contains('is-active')) ? selB : selA;
            if (!e.relatedTarget || !e.relatedTarget.closest(activeSel)) {
                b.classList.remove('has-focus-hover', 'has-panel-focus-hover');
                document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
            }
        });
    },

    initGlobalScrollInteraction() {
        const h = document.getElementById('ui-header'); const lwM = document.getElementById('ui-logo-gif-wrap-m'); 
        const bg = document.getElementById('ui-header-bg'); const lp = document.getElementById('ui-logo-panel');
        const lh = document.getElementById('ui-landing-hero');
        
        let timer; let lastScrollY = window.scrollY; let ticking = false;

        window.addEventListener('scroll', () => {
            if (ENGINE.isMobile()) {
                if (!ticking) {
                    requestAnimationFrame(() => {
                        const currentScrollY = window.scrollY;
                        const isScrollingDown = currentScrollY > lastScrollY;
                        lastScrollY = currentScrollY;

                        if (isScrollingDown && currentScrollY > 10) {
                            if (h && !h.classList.contains('is-nav-hidden')) {
                                h.classList.add('is-nav-hidden'); 
                                if (lwM) lwM.classList.add('is-nav-hidden'); if (bg) bg.classList.add('is-nav-hidden');
                                if (lh) lh.classList.add('is-nav-hidden');
                                
                                const st = document.getElementById('ui-hero-special-text');
                                const cr = document.getElementById('ui-contact-row');
                                const cb = document.getElementById('ui-close-btn');
                                if (st) st.classList.add('is-nav-hidden');
                                if (cr) cr.classList.add('is-nav-hidden');
                                if (cb) cb.classList.add('is-nav-hidden');
                            }
                        }

                        clearTimeout(timer); 
                        timer = setTimeout(() => { 
                            if (h && h.classList.contains('is-nav-hidden')) {
                                h.classList.remove('is-nav-hidden'); 
                                if (lwM) lwM.classList.remove('is-nav-hidden'); if (bg) bg.classList.remove('is-nav-hidden');
                                if (lh) lh.classList.remove('is-nav-hidden');
                                
                                const st = document.getElementById('ui-hero-special-text');
                                const cr = document.getElementById('ui-contact-row');
                                const cb = document.getElementById('ui-close-btn');
                                if (st) st.classList.remove('is-nav-hidden');
                                if (cr) cr.classList.remove('is-nav-hidden');
                                if (cb) cb.classList.remove('is-nav-hidden');
                            }
                        }, 350);
                        ticking = false;
                    });
                    ticking = true;
                }
            }
        }, { passive: true });
    },
    
    initWeChatTrigger() {
        const t = document.getElementById('trigger-wechat'); const o = document.getElementById('ui-wechat-overlay');
        if (t && o) { t.onclick = (e) => { e.preventDefault(); o.classList.add('is-active'); }; o.onclick = () => o.classList.remove('is-active'); }
    },
    /* ==========================================================================
       ⬆️⬆️ 全局通用 JS 结束 ⬆️⬆️
       ========================================================================== */



    /* ==========================================================================
       [3] 页面专属 JS 逻辑 (PAGE SPECIFIC - HOME ONLY)
       ========================================================================== */
    applyPageTypography() {
        if(typeof CONFIG_PAGE === 'undefined' || !CONFIG_PAGE.gallery) return;
        const r = document.documentElement; 
        const p = { 
            '--gallery-content-fs': CONFIG_PAGE.gallery.contentStyles.sizePC,
            '--gallery-content-fs-m': CONFIG_PAGE.gallery.contentStyles.sizeMobile,
            '--gallery-font': CONFIG_PAGE.gallery.font, 
            '--gallery-fw': CONFIG_PAGE.gallery.weight, 
            '--gallery-paragraph-spacing': CONFIG_PAGE.gallery.paragraphSpacing,
            '--splash-dur': CONFIG_PAGE.splash ? `${CONFIG_PAGE.splash.transitionTime}ms` : '1.2s'
        };
        Object.entries(p).forEach(([k, v]) => r.style.setProperty(k, v));
    },

    buildContent() {
        if(typeof CONFIG_PAGE === 'undefined' || !CONFIG_PAGE.gallery) return;
        const g = document.getElementById('ui-main-grid');
        if(!g) return;
        g.innerHTML = CONFIG_PAGE.gallery.items.map(i => {
            const paras = i.paragraphs.map(p => `<p class="fl-paragraph">${p}</p>`).join('');
            return `<div class="fl-item-wrapper fl-reveal" style="grid-column: span ${i.span || 12};"><div class="fl-gallery-text">${paras}</div></div>`;
        }).join('');
    },
    
    initSplash() {
        if(typeof CONFIG_PAGE === 'undefined' || !CONFIG_PAGE.splash) return;
        const s = document.getElementById('ui-splash'); const st = document.getElementById('ui-splash-text'); 
        const sbPC = document.getElementById('ui-splash-bg-pc'); 
        const sbM = document.getElementById('ui-splash-bg-m');
        if(!s || !st || !sbPC || !sbM) return;

        st.innerText = CONFIG_PAGE.splash.text; 
        
        const isMob = ENGINE.isMobile();

        const d = () => {
            if (!document.body.classList.contains('is-loading')) return;
            s.classList.add('is-finished'); document.body.classList.remove('is-loading');
            sessionStorage.setItem('fl_visited', 'true');
            ENGINE.initReveal();

            setTimeout(() => {
                if (s && s.parentNode) s.parentNode.removeChild(s);
            }, CONFIG_PAGE.splash.transitionTime);
        };

        if (sessionStorage.getItem('fl_visited')) { 
            document.body.classList.remove('is-loading'); s.classList.add('is-finished'); 
            ENGINE.initReveal(); 
            if (s && s.parentNode) s.parentNode.removeChild(s);
            return; 
        }

        /* 核心修复：拦截并阻断浏览器自动恢复上次阅读位置的默认行为，强制页面回顶 */
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        s.onclick = d;

        // 核心修改：逻辑分支解耦
        if (isMob) {
            // 移动端：启用 GIF，使用配置的 holdTimeMobile 安全关闭
            sbM.src = CONFIG_PAGE.splash.bgMobile;
            const startSplashM = () => {
                setTimeout(d, CONFIG_PAGE.splash.holdTimeMobile);
            };
            
            if (sbM.complete) {
                startSplashM();
            } else {
                sbM.onload = startSplashM;
                setTimeout(() => { if(document.body.classList.contains('is-loading')) d(); }, 6000);
            }
        } else {
            // PC 端：启用 WebM，绝不使用死板的 holdTime，完美贴合视频的原生 ended 事件
            sbPC.src = CONFIG_PAGE.splash.bgPC;
            sbPC.muted = true;
            sbPC.defaultMuted = true;
            sbPC.playsInline = true;
            sbPC.loop = false;
            
            sbPC.load();

            sbPC.addEventListener('ended', d, { once: true });

            let playPromise = sbPC.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    setTimeout(d, 3000);
                });
            }
            setTimeout(() => { if(document.body.classList.contains('is-loading')) d(); }, 8000);
        }
    },

    initReveal() {
        if (ENGINE.revealObserver) {
            ENGINE.revealObserver.disconnect();
        }

        ENGINE.revealObserver = new IntersectionObserver((es) => es.forEach(e => { 
            if (e.isIntersecting) { 
                e.target.classList.add('is-visible'); 
                if (ENGINE.isMobile()) ENGINE.revealObserver.unobserve(e.target); 
            } 
        }), { threshold: 0.05 });
        
        document.querySelectorAll('.fl-reveal').forEach(el => ENGINE.revealObserver.observe(el));
    },

    initCustomCursor() {
        if (ENGINE.isMobile()) return;
        const v = document.getElementById('ui-cursor-v'); const h = document.getElementById('ui-cursor-h');
        if(!v || !h) return;
        let ticking = false;
        window.addEventListener('mousemove', (e) => {
            if (document.body.classList.contains('is-loading')) return;
            if (!ticking) { requestAnimationFrame(() => { v.style.transform = `translate3d(${e.clientX}px, 0, 0)`; h.style.transform = `translate3d(0, ${e.clientY}px, 0)`; ticking = false; }); ticking = true; }
        }, { passive: true });
    },

    start() {
        ENGINE.initSEO();
        ENGINE.initPerformanceMode(); 
        
        ENGINE.applyGlobalTypography(); 
        ENGINE.renderHeader(); 
        ENGINE.renderLogoPanel();
        ENGINE.initGlobalFocusMode(); 
        ENGINE.initGlobalScrollInteraction();
        ENGINE.initTriggersAndInteractions(); 
        
        ENGINE.applyPageTypography();
        ENGINE.initCustomCursor();
        if(typeof CONFIG_PAGE !== 'undefined' && CONFIG_PAGE.gallery) ENGINE.buildContent(); 
        if(typeof CONFIG_PAGE !== 'undefined' && CONFIG_PAGE.splash) ENGINE.initSplash();
        else { document.body.classList.remove('is-loading'); ENGINE.initReveal(); }

        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const currentIsMobile = ENGINE.isMobile();
                const widthChanged = Math.abs(window.innerWidth - ENGINE.lastWidth) > 5;
                const heightChanged = window.innerHeight !== ENGINE.lastHeight;

                if (currentIsMobile !== ENGINE.lastIsMobile) {
                    ENGINE.lastIsMobile = currentIsMobile; ENGINE.lastWidth = window.innerWidth; ENGINE.lastHeight = window.innerHeight;
                    ENGINE.resetAllStates(); 
                    if(typeof CONFIG_PAGE !== 'undefined' && CONFIG_PAGE.gallery) ENGINE.buildContent(); 
                    ENGINE.initReveal(); 
                } else if (widthChanged) {
                    ENGINE.lastWidth = window.innerWidth; 
                    if(typeof CONFIG_PAGE !== 'undefined' && CONFIG_PAGE.gallery) ENGINE.buildContent(); 
                    ENGINE.initReveal(); 
                    if (!ENGINE.isMobile()) {
                        const h = document.getElementById('ui-landing-hero'); 
                        const p = document.getElementById('ui-logo-panel');
                        if (h && h.classList.contains('is-active') && p && p.classList.contains('is-panel-pinned')) ENGINE.showHeroPC(true);
                    } else {
                        const h = document.getElementById('ui-landing-hero');
                        if (h && h.classList.contains('is-active')) ENGINE.showHeroMobile();
                    }
                }
                ENGINE.lastHeight = window.innerHeight;
            }, 150);
        }, { passive: true });
    }
};

if (document.readyState === 'loading') {

} else {

}
