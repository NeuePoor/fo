<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 
  项目名称: Folio Portfolio Navigation
  版本号: v1.3
  描述: 修复 v1.2 移动端断点失效及汉堡包消失问题，恢复导航链接样式。
-->
<title>Folio v1.3 - Portfolio Navigation</title>
<style>
  /* ==============================================
     【小白自定义配置区 - 修改这里即可】
     ==============================================
  */
  :root {
    /* --- 1. 桌面端设置 --- */
    --logo-video-webm: "https://folio.neuepoor.com/head_chrome.webm"; 
    --logo-video-mp4: "https://folio.neuepoor.com/head_safari.mp4";   
    --logo-height: 48px;          
    --logo-text: "Fooz";          
    --logo-font-size: 32px;       
    --logo-link-url: "home";         

    /* --- 2. 移动端专项设置 (Folio v1.3) --- */
    --mobile-logo-text: "F.";     
    --mobile-logo-font-size: 18px; 
    --mobile-logo-height: 18px;   /* 对应你要求的 18px 高度 */
    --mobile-nav-height: 18px;    
    --mobile-hamburger-size: 20px; 

    /* --- 3. 导航菜单链接 --- */
    --nav-link-1-text: "Works";   
    --nav-link-1-url: "#work";    
    --nav-link-2-text: "(Play)";  
    --nav-link-2-url: "#play";    
    --nav-link-3-text: "Me";      
    --nav-link-3-url: "#me";      

    /* --- 4. 视觉样式设置 --- */
    --nav-font-size: 32px;        
    --nav-gap: 40px;              
    --mobile-menu-bg: #BABABA;    
    --mobile-nav-font-size: 48px; 
    
    /* --- 5. 布局与边距设置 --- */
    --side-padding: 8px;          
    --vertical-padding: 8px;      
    
    --font-family: "Arial", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);  
  }

  /* ==============================================
     【核心渲染区】
     ==============================================
  */

  body, html {
    margin: 0;
    padding: 0;
    font-family: var(--font-family);
    background: transparent;
  }

  /* 导航栏容器 */
  .custom-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%; 
    display: flex;
    justify-content: space-between;
    align-items: center; 
    padding: var(--vertical-padding) var(--side-padding); 
    color: #000000; 
    background: transparent;
    box-sizing: border-box;
    z-index: 2000;
    pointer-events: none; 
  }

  .logo-container, .nav-links, .menu-toggle {
    pointer-events: auto; 
    display: flex;
    align-items: center;
  }

  .logo-container {
    text-decoration: none;
    color: inherit;
    height: var(--logo-height);
    transition: var(--transition);
  }

  .logo-video {
    height: 100%;
    width: auto;
    display: none; 
    outline: none;
    background: transparent;
    object-fit: contain;
    -webkit-mask-image: -webkit-radial-gradient(white, black);
  }

  .logo-fallback {
    font-weight: bold;
    font-size: var(--logo-font-size);
    letter-spacing: -0.05em;
    line-height: 1;
  }

  /* 桌面端链接样式 */
  .nav-links {
    display: flex;
    gap: var(--nav-gap);
  }

  .nav-links a {
    text-decoration: none;
    color: inherit;
    font-size: var(--nav-font-size); 
    font-weight: bold;
    transition: var(--transition);
    line-height: 1;
  }

  .nav-links a:hover {
    opacity: 0.5;
  }

  /* 汉堡包按钮样式修复 */
  .menu-toggle {
    display: none; /* 默认隐藏，在 media query 中开启 */
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px;
    margin-right: -10px; /* 抵消内边距使图标靠边 */
    z-index: 2100;
    outline: none;
  }

  .hamburger-box {
    width: var(--mobile-hamburger-size);
    height: 14px;
    position: relative;
    display: block;
  }

  .hamburger-inner {
    display: block;
    top: 50%;
    margin-top: -1px;
    width: 100%;
    height: 2px;
    background-color: #000;
    position: absolute;
    transition: var(--transition);
  }

  .hamburger-inner::before, .hamburger-inner::after {
    content: "";
    display: block;
    width: 100%;
    height: 2px;
    background-color: #000;
    position: absolute;
    transition: var(--transition);
  }

  .hamburger-inner::before { top: -6px; } 
  .hamburger-inner::after { bottom: -6px; }

  /* 汉堡包展开状态动画 */
  .is-open .hamburger-inner { transform: rotate(45deg); }
  .is-open .hamburger-inner::before { top: 0; opacity: 0; }
  .is-open .hamburger-inner::after { bottom: 0; transform: rotate(-90deg); }

  /* 移动端菜单层样式修复 */
  .mobile-menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%; 
    height: 100vh; 
    background-color: var(--mobile-menu-bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start; 
    padding: 0 40px;
    box-sizing: border-box;
    transition: var(--transition);
    z-index: 1900; 
    transform: translateY(-100%);
    visibility: hidden;
    pointer-events: auto;
  }

  .mobile-menu-overlay.is-active {
    transform: translateY(0);
    visibility: visible;
  }

  .mobile-menu-overlay a {
    text-decoration: none;
    color: #000;
    font-size: var(--mobile-nav-font-size);
    font-weight: bold;
    margin-bottom: 24px;
    line-height: 1.2;
    transition: opacity 0.3s;
  }

  .mobile-menu-overlay a:active {
    opacity: 0.5;
  }

  /* ==============================================
     【响应式断点】
     ==============================================
  */
  @media (max-width: 768px) {
    .nav-links { display: none; }
    
    .menu-toggle { 
      display: flex; 
    }
    
    .logo-container {
      height: var(--mobile-logo-height);
    }
    
    .logo-fallback {
      font-size: var(--mobile-logo-font-size);
    }

    .custom-nav {
      /* 确保容器高度正确 */
      min-height: calc(var(--mobile-nav-height) + (var(--vertical-padding) * 2));
      padding: var(--vertical-padding) var(--side-padding);
    }
  }
</style>
</head>
<body>

  <nav class="custom-nav" id="mainNav">
    <a href="/" class="logo-container" id="logoLink">
      <video 
        class="logo-video" 
        id="logoVid" 
        autoplay 
        loop 
        muted 
        playsinline 
        webkit-playsinline
        disablePictureInPicture 
        preload="auto"
      >
        <source id="srcMp4" type='video/mp4; codecs="hvc1"'> 
        <source id="srcWebm" type="video/webm">
      </video>
      <span class="logo-fallback" id="fallbackText">Fooz</span>
    </a>
    
    <div class="nav-links">
      <a href="#work" id="nav1">Works</a>
      <a href="#play" id="nav2">(Play)</a>
      <a href="#me" id="nav3">Me</a>
    </div>

    <button class="menu-toggle" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">
      <span class="hamburger-box">
        <span class="hamburger-inner"></span>
      </span>
    </button>
  </nav>

  <div class="mobile-menu-overlay" id="mobileMenu">
    <a href="#work" id="mobNav1" onclick="toggleMenu()">Works</a>
    <a href="#play" id="mobNav2" onclick="toggleMenu()">(Play)</a>
    <a href="#me" id="mobNav3" onclick="toggleMenu()">Me</a>
  </div>

  <script>
    let isMenuOpen = false;

    // 菜单开关逻辑
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      const btn = document.getElementById('menuBtn');
      isMenuOpen = !isMenuOpen;
      
      if (isMenuOpen) {
        menu.classList.add('is-active');
        btn.classList.add('is-open');
        document.body.style.overflow = 'hidden'; 
      } else {
        menu.classList.remove('is-active');
        btn.classList.remove('is-open');
        document.body.style.overflow = ''; 
      }
    }

    // 初始化内容与配置联动
    function initNav() {
      const root = document.documentElement;
      const getVar = (name) => getComputedStyle(root).getPropertyValue(name).replace(/"/g, '').trim();
      
      const logoLink = document.getElementById('logoLink');
      const linkUrl = getVar('--logo-link-url');
      if (linkUrl) logoLink.href = linkUrl;

      // 实时切换移动端/桌面端文字
      const updateLogoText = () => {
        const isMobile = window.innerWidth <= 768;
        const text = isMobile ? getVar('--mobile-logo-text') : getVar('--logo-text');
        document.getElementById('fallbackText').textContent = text;
      };
      
      updateLogoText();
      window.addEventListener('resize', updateLogoText);
      
      // 同步链接文字与地址
      const navItems = [
        {id: 'nav1', mobId: 'mobNav1', textVar: '--nav-link-1-text', urlVar: '--nav-link-1-url'},
        {id: 'nav2', mobId: 'mobNav2', textVar: '--nav-link-2-text', urlVar: '--nav-link-2-url'},
        {id: 'nav3', mobId: 'mobNav3', textVar: '--nav-link-3-text', urlVar: '--nav-link-3-url'}
      ];

      navItems.forEach(item => {
        const text = getVar(item.textVar);
        const url = getVar(item.urlVar);
        const el = document.getElementById(item.id);
        const mobEl = document.getElementById(item.mobId);
        if (el) { el.textContent = text; el.href = url; }
        if (mobEl) { mobEl.textContent = text; mobEl.href = url; }
      });

      // 视频加载与回退逻辑
      const video = document.getElementById('logoVid');
      const fallback = document.getElementById('fallbackText');
      const webmSrc = getVar('--logo-video-webm');
      const mp4Src = getVar('--logo-video-mp4');

      if (webmSrc || mp4Src) {
        document.getElementById('srcMp4').src = mp4Src;
        document.getElementById('srcWebm').src = webmSrc;
        video.load();
        
        video.oncanplay = () => {
          video.style.display = 'block';
          fallback.style.display = 'none';
        };

        video.onerror = () => {
          video.style.display = 'none';
          fallback.style.display = 'block';
        };
      }
    }

    document.addEventListener('DOMContentLoaded', initNav);

    // 窗口调整防护
    window.addEventListener('resize', () => {
      if (window.innerWidth > 768 && isMenuOpen) {
        toggleMenu();
      }
    });
  </script>
</body>
</html>
