<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="render" content="webkit">
<title>Foo</title>
<link id="favicon" rel="icon" type="image/webp" href="https://folio.neuepoor.com/favicon.webp">

<style>
/* ==========================================================================
   DYNAMIC DESIGN TOKENS (CSS VARIABLES)
   ========================================================================== */
:root {
    --fl-bg: #ffffff;
    --fl-text: #000000;
    --fl-gutter: 4px;
    --fl-margin: 4px;
    --fl-nav-h: 60px;
    --fl-nav-h-m: 44px;
    --fl-ease: cubic-bezier(0.23, 1, 0.32, 1);
    --fl-reveal-dist: 30px;
    --fl-reveal-dur: 1.2s;
    --fl-font-fallback: "Arial", "Helvetica", sans-serif;
    --splash-fs: 32px;
    --gallery-paragraph-spacing: 2.2em;
    
    --grid-col-width: calc((100vw - (var(--fl-margin) * 2) - (var(--fl-gutter) * 11)) / 12);
    --cr-height: 105px;
    --st-height: 21px;
    --bg-height: 230px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --fl-bg: #000000;
        --fl-text: #ffffff;
    }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
html, body { scrollbar-width: none; -ms-overflow-style: none; user-select: none; height: 100%; margin: 0; padding: 0; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

@media (min-width: 769px) {
    body:not(.is-loading) { cursor: none; }
    body:not(.is-loading) a, 
    body:not(.is-loading) button, 
    body:not(.is-loading) img { cursor: none !important; }
}

body {
    font-family: var(--fl-font-fallback);
    background: var(--fl-bg);
    color: var(--fl-text);
    overflow-x: hidden;
    line-height: 1.4;
    transition: background-color 0.25s ease-out;
}

body.is-loading { overflow: hidden; }

.fl-cursor {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 99999; mix-blend-mode: difference;
    opacity: 0; transition: opacity 0.5s ease; display: none;
}
@media (min-width: 769px) and (pointer: fine) {
    .fl-cursor { display: block; }
    body:not(.is-loading) .fl-cursor { opacity: 1; }
}
.fl-cursor__v, .fl-cursor__h { position: absolute; background: #fff; will-change: transform; }
.fl-cursor__v { width: 1px; height: 100vh; top: 0; left: 0; }
.fl-cursor__h { height: 1px; width: 100vw; left: 0; top: 0; }

.fl-splash {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 9999; display: flex; align-items: center; justify-content: center;
    background: var(--fl-bg); transition: background 1.2s var(--fl-ease);
}
.fl-splash__bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://folio.neuepoor.com/fo.gif') center/cover no-repeat;
    transition: filter 1.8s var(--fl-ease), opacity 1.8s var(--fl-ease), transform 1.8s var(--fl-ease);
    z-index: 1; opacity: 1;
}
.fl-splash__text {
    position: relative; z-index: 3;
    font-size: var(--splash-fs); font-weight: 700; color: #fff;
    mix-blend-mode: difference; opacity: 1; pointer-events: none;
    transition: opacity 0.5s var(--fl-ease);
}
.fl-splash.is-finished { pointer-events: none; background: transparent; z-index: 1; }
.fl-splash.is-finished .fl-splash__bg { filter: blur(40px); opacity: 1; transform: scale(1.1); }
.fl-splash.is-finished .fl-splash__text { opacity: 0 !important; visibility: hidden; }

.fl-landing-hero {
    position: fixed; z-index: 1001; pointer-events: none;
    overflow: hidden; opacity: 0; transform: translate3d(0,0,0);
    visibility: hidden;
    will-change: opacity, filter;
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease), visibility 0.4s var(--fl-ease);
}
.fl-landing-hero.is-active { pointer-events: auto; opacity: 1; visibility: visible; } 
.fl-landing-hero img { width: 100%; height: 100%; object-fit: cover; }

.fl-logo__gif-wrap-pc { 
    position: fixed; top: 0; left: 4px; height: var(--fl-nav-h); 
    display: flex; align-items: center; z-index: 3001; 
    transition: transform 0.4s var(--fl-ease), opacity 0.6s var(--fl-ease); 
}
.fl-logo__gif-wrap-m { display: none; }
.fl-logo__gif { height: var(--logo-size-pc); width: auto; opacity: 0; transition: opacity 0.3s var(--fl-ease); cursor: pointer; }

.fl-header { 
    position: fixed; width: 100%; z-index: 3000; display: flex; 
    justify-content: space-between; align-items: center; padding: 0 4px; 
    height: var(--fl-nav-h); top: 0; 
    mix-blend-mode: difference;
    transition: transform 0.4s var(--fl-ease); 
}
.fl-logo-text { 
    text-decoration: none; 
    color: #fff; 
    font-size: var(--header-fs); 
    font-weight: var(--header-fw); 
    opacity: 0; 
    pointer-events: none; 
}
.fl-nav { display: flex; gap: 40px; }
.fl-nav__link { 
    font-size: var(--nav-fs); 
    font-weight: var(--header-fw); 
    color: #fff; 
    text-decoration: none; 
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease); 
}

.fl-header__bg { display: none; }

.fl-grid {
    position: relative; display: grid; grid-template-columns: repeat(12, 1fr);
    gap: var(--fl-gutter); margin: var(--fl-margin);
    min-height: calc(100vh - (var(--fl-margin) * 2)); 
    align-content: start; padding: 80px 0 100px; 
    z-index: 10; 
}

@media (min-width: 769px) {
    .fl-grid.is-intro { padding-top: calc(100vh - 280px); } 
}

.fl-reveal { 
    opacity: 0; 
    transform: translateY(var(--fl-reveal-dist)); 
    transition: opacity var(--fl-reveal-dur) var(--fl-ease), transform var(--fl-reveal-dur) var(--fl-ease); 
    will-change: opacity, transform; 
}
.fl-reveal.is-visible { opacity: 1; transform: translateY(0); }

.fl-gallery-text { width: 100%; max-width: 850px; margin-bottom: 0; }

@media (min-width: 769px) {
    .fl-gallery-text { max-width: 100% !important; }
    .fl-reveal { --fl-reveal-dist: 100px; }
}

.fl-paragraph {
    font-size: clamp(var(--gallery-content-fs-m), 1vw + 13px, var(--gallery-content-fs));
    font-weight: var(--gallery-fw);
    color: var(--fl-text);
    line-height: 1.35;
    margin: 0 0 var(--gallery-paragraph-spacing) 0;
    text-wrap: pretty; 
    word-break: break-word; 
    -webkit-hyphens: auto;
    hyphens: auto; 
}

.fl-paragraph:last-child { margin-bottom: 0; }

.fl-logo-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; }
.fl-logo-panel.is-panel-pinned { pointer-events: auto; }

.fl-hero-special-text, .fl-contact-row {
    position: fixed; 
    opacity: 0; 
    filter: blur(15px); 
    pointer-events: none; 
    visibility: hidden; 
    transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease), visibility 0.4s var(--fl-ease);
}

#ui-landing-hero.is-active ~ #ui-logo-panel .fl-hero-special-text,
#ui-landing-hero.is-active ~ #ui-logo-panel .fl-contact-row {
    opacity: 1; 
    filter: blur(0px); 
    pointer-events: auto;
    visibility: visible; 
}

.fl-hero-special-text { font-size: var(--special-text-fs); font-weight: var(--gallery-fw); color: var(--fl-text); white-space: nowrap; }
.fl-contact-row { display: flex; gap: 40px; align-items: center; }
.fl-gallery-link { font-size: var(--contact-fs); font-weight: var(--gallery-fw); color: var(--fl-text); text-decoration: none; transition: opacity 0.4s var(--fl-ease), filter 0.4s var(--fl-ease); }

@media (min-width: 769px) {
    .fl-nav__link, .fl-logo__gif-wrap-pc, .fl-hero-special-text, .fl-contact-row, .fl-landing-hero { transition: opacity 0.6s var(--fl-ease), filter 0.6s var(--fl-ease), visibility 0.5s var(--fl-ease) !important; }
    .fl-reveal { transition: opacity var(--fl-reveal-dur) var(--fl-ease), transform var(--fl-reveal-dur) var(--fl-ease), filter 0.6s var(--fl-ease) !important; }

    body.has-focus-hover .fl-nav__link:not(.is-hovered-target),
    body.has-focus-hover .fl-logo__gif-wrap-pc:not(.is-hovered-target),
    body.has-focus-hover .fl-reveal:not(.is-hovered-target) { opacity: 0.2; filter: blur(8px); }

    #ui-landing-hero.is-active ~ #ui-main-grid .fl-reveal { opacity: 0.2; filter: blur(8px); }

    body.has-panel-focus-hover #ui-landing-hero:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-logo__gif-wrap-pc:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-nav__link:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-hero-special-text:not(.is-hovered-target),
    body.has-panel-focus-hover .fl-gallery-link:not(.is-hovered-target) { opacity: 0.2 !important; filter: blur(8px) !important; }

    body.has-panel-focus-hover .is-hovered-target { opacity: 1 !important; filter: blur(0px) !important; }
}

.fl-wechat-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 11000; display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: 0.4s var(--fl-ease);
}
.fl-wechat-overlay.is-active { opacity: 1; visibility: visible; }
.fl-wechat-card { width: 320px; background: #fff; padding: 40px; text-align: center; }
.fl-wechat-qr { width: 100%; aspect-ratio: 1; margin-bottom: 24px; }
.fl-wechat-qr img { width: 100%; height: 100%; object-fit: contain; }

@media (max-width: 768px) {
    .fl-logo__gif-wrap-pc { display: none !important; }
    .fl-grid { padding: 4px 0 160px !important; margin-top: 0 !important; }
    .fl-gallery-text { width: 100% !important; max-width: 100% !important; }
    .fl-paragraph { font-size: var(--gallery-content-fs-m) !important; margin-bottom: 1.8em !important; }
    .fl-paragraph:last-child { margin-bottom: 0 !important; }
    
    .fl-header__bg {
        display: block; position: fixed; bottom: 24px; left: 32px; width: calc(100% - 64px);
        height: 44px; background: rgba(255, 255, 255, 0.2) !important; 
        backdrop-filter: blur(16px) saturate(160%) !important;
        border: 0.5px solid rgba(0, 0, 0, 0.1) !important; border-radius: 12px !important;
        z-index: 1000 !important; pointer-events: none;
        transition: height 0.6s var(--fl-ease), transform 0.4s var(--fl-ease) !important;
    }
    .fl-header__bg.is-expanded { height: var(--bg-height) !important; }

    @media (prefers-color-scheme: dark) {
        .fl-header__bg {
            background: rgba(28, 28, 30, 0.45) !important;
            border: 0.5px solid rgba(255, 255, 255, 0.1) !important;
        }
    }
    
    .fl-landing-hero {
        top: auto !important; left: auto !important; right: var(--hero-right-mb, 48px) !important;
        bottom: calc(var(--hero-bottom-base-mb, 80px) + (var(--cr-height) / 2) - (var(--hero-size-mb) / 2)) !important;
        width: var(--hero-size-mb) !important; height: var(--hero-size-mb) !important;
        transform: none !important; z-index: 1001 !important;
    }
    .fl-landing-hero img { border-radius: 8px !important; }
    
    .fl-logo-panel { z-index: 1004 !important; }
    .fl-hero-special-text {
        font-family: "Arial", sans-serif !important; font-size: var(--special-text-fs-m) !important;
        font-weight: 700 !important; line-height: 1 !important; width: calc(50% - 24px) !important;
        white-space: normal !important; top: auto !important; bottom: calc(80px + var(--cr-height) + 24px) !important;
        left: 48px !important; transform: none !important;
    }
    .fl-contact-row {
        display: flex !important; flex-direction: column !important; align-items: flex-start !important;
        gap: 0px !important; width: calc(50% - 24px) !important; top: auto !important;
        bottom: 80px !important; left: 48px !important; transform: none !important;
    }
    .fl-contact-row .fl-gallery-link {
        font-family: "Arial", sans-serif !important; font-size: var(--contact-fs-m) !important;
        font-weight: 700 !important; line-height: 1.05 !important; 
    }

    .fl-header {
        top: auto !important; bottom: 24px !important; left: 32px !important; width: calc(100% - 64px) !important;
        height: 44px !important; padding: 0 16px !important; border-radius: 12px !important;
        background: transparent !important; backdrop-filter: none !important; border: none !important; 
        z-index: 1005 !important; mix-blend-mode: normal !important;
    }
    
    .fl-logo__gif-wrap-m { 
        display: flex !important; position: fixed; top: auto !important; bottom: 24px !important; 
        left: 48px !important; height: 44px !important; align-items: center !important;
        z-index: 1006 !important; 
    }
    .fl-logo__gif-wrap-m .fl-logo__gif { height: 18px !important; opacity: 1 !important; }
    
    .fl-nav { 
        position: absolute !important; bottom: 0 !important; right: 16px !important;
        height: 44px !important; display: flex !important; align-items: center !important; gap: 20px !important; 
    }
    .fl-nav__link { font-size: var(--nav-fs-m) !important; color: var(--fl-text) !important; opacity: 1 !important; filter: none !important; }
    .fl-logo-text { opacity: 0 !important; }
}
</style>
</head>
<body class="is-loading">

<div class="fl-cursor" id="ui-cursor">
    <div class="fl-cursor__v" id="ui-cursor-v"></div>
    <div class="fl-cursor__h" id="ui-cursor-h"></div>
</div>

<div class="fl-splash" id="ui-splash">
    <div class="fl-splash__bg" id="ui-splash-bg"></div>
    <div class="fl-splash__text" id="ui-splash-text"></div>
</div>

<div class="fl-header__bg" id="ui-header-bg"></div>

<div class="fl-landing-hero" id="ui-landing-hero">
    <img src="" alt="Landing" id="ui-hero-img">
</div>

<div class="fl-logo-panel" id="ui-logo-panel">
    <div class="fl-hero-special-text" id="ui-hero-special-text"></div>
    <div class="fl-contact-row" id="ui-contact-row"></div>
</div>

<div class="fl-logo__gif-wrap-pc" id="ui-logo-gif-wrap-pc">
    <img class="fl-logo__gif" id="ui-logo-gif-pc" alt="Logo" draggable="false">
</div>

<div class="fl-logo__gif-wrap-m" id="ui-logo-gif-wrap-m">
    <img class="fl-logo__gif" id="ui-logo-gif-m" alt="Logo" draggable="false">
</div>

<header class="fl-header" id="ui-header">
    <a href="https://neuepoor.com" class="fl-logo-text" id="ui-logo-text">Foo</a>
    <nav class="fl-nav" id="ui-nav"></nav>
</header>

<main class="fl-grid is-intro" id="ui-main-grid"></main>

<div class="fl-wechat-overlay" id="ui-wechat-overlay">
    <div class="fl-wechat-card">
        <div class="fl-wechat-qr"><img src="https://folio.neuepoor.com/wechatsuckboyz.svg" alt="WeChat"></div>
        <div class="fl-wechat-id">WeChat: NeuePoor</div>
    </div>
</div>

<script>
const CONFIG = {
    version: "Home 4.14.14",
    seo: { title: "Foo", favicon: "https://folio.neuepoor.com/favicon.webp" },
    splash: { text: "Folio", bg: "https://folio.neuepoor.com/fo.gif" },
    
    header: {
        logo: { gif: "https://folio.neuepoor.com/logo.gif", text: "Foo", font: "Arial, sans-serif", weight: "700", sizePC: "32px", sizeMobile: "21px" },
        nav: [
            { name: 'Works', link: 'https://works.neuepoor.com', sizePC: "32px", sizeMobile: "21px" },
            { name: '(Play)', link: 'https://play.neuepoor.com', sizePC: "32px", sizeMobile: "21px" },
            { name: 'Me', link: 'https://Me.neuepoor.com', sizePC: "32px", sizeMobile: "21px" }
        ]
    },
    
    logoPanel: {
        heroImg: "https://folio.neuepoor.com/landing.gif",
        specialText: { text: "Hi, I'm Fo", sizePC: "32px", sizeMobile: "21px" },
        contact: [
            { name: "Email", link: "mailto:poorleaglguy@qq.com" },
            { name: "Instagram", link: "https://www.instagram.com/neuepoor" },
            { name: "Github", link: "https://github.com/NeuePoor" },
            { name: "小红书", link: "https://xhslink.com/m/9qPnrun1Dh9" },
            { name: "WeChat", link: "#", isWeChat: true }
        ],
        contactStyles: { sizePC: "21px", sizeMobile: "10px" }
    },
    
    gallery: { 
        font: "Arial, sans-serif", 
        weight: "700", 
        paragraphSpacing: "2.2em",
        contentStyles: { sizePC: "48px", sizeMobile: "32px" },
        items: [{ 
            span: 12, 
            paragraphs: [
                "I'm a multi-disciplinary designer with focus on Graphic&Illustration,Creative Direction, Branding,Visual Identities, Packaging, Website, and Print& Editorial Design.",
                "If you are looking for a designer who excles in BrandStrategy/Visual Direction/Print Works/Products/IP/Curatorial/Grid Layout/Website design/Typeface Customization.",
                "Please contact me."
            ]
        }] 
    },
    
    heroImage: {
        colSpanPC: 6.0,
        colSpanMobile: 5.0,
        position: {
            pc: { anchorColumn: 10, top: "50%", transform: "translate3d(-50%, -50%, 0)" },
            mobile: { right: "21px", bottomBase: "80px" }
        }
    }
};

const ENGINE = {
    applyTypography() {
        const r = document.documentElement; 
        const c = CONFIG;
        
        const p = { 
            '--header-font': c.header.logo.font, 
            '--header-fw': c.header.logo.weight, 
            '--header-fs': c.header.logo.sizePC, 
            '--header-fs-m': c.header.logo.sizeMobile, 
            '--nav-fs': c.header.nav[0].sizePC,
            '--nav-fs-m': c.header.nav[0].sizeMobile,
            '--special-text-fs': c.logoPanel.specialText.sizePC,
            '--special-text-fs-m': c.logoPanel.specialText.sizeMobile,
            '--contact-fs': c.logoPanel.contactStyles.sizePC,
            '--contact-fs-m': c.logoPanel.contactStyles.sizeMobile,
            '--gallery-content-fs': c.gallery.contentStyles.sizePC,
            '--gallery-content-fs-m': c.gallery.contentStyles.sizeMobile,
            '--gallery-font': c.gallery.font, 
            '--gallery-fw': c.gallery.weight, 
            '--gallery-paragraph-spacing': c.gallery.paragraphSpacing,
            '--logo-size-pc': c.header.logo.sizePC, 
            '--logo-size-m': c.header.logo.sizeMobile,
            
            '--hero-col-span-pc': c.heroImage.colSpanPC,
            '--hero-col-span-mb': c.heroImage.colSpanMobile,
            '--hero-size-pc': `calc(var(--hero-col-span-pc) * var(--grid-col-width) + (var(--hero-col-span-pc) - 1) * var(--fl-gutter))`,
            '--hero-size-mb': `calc(var(--hero-col-span-mb) * var(--grid-col-width) + (var(--hero-col-span-mb) - 1) * var(--fl-gutter))`,
            
            '--hero-top-pc': c.heroImage.position.pc.top,
            '--hero-transform-pc': c.heroImage.position.pc.transform,
            '--hero-right-mb': c.heroImage.position.mobile.right,
            '--hero-bottom-base-mb': c.heroImage.position.mobile.bottomBase
        };
        Object.entries(p).forEach(([k, v]) => r.style.setProperty(k, v));
    },
    
    renderHeader() {
        const gPC = document.getElementById('ui-logo-gif-pc');
        const gM = document.getElementById('ui-logo-gif-m');
        const t = document.getElementById('ui-logo-text');
        const n = document.getElementById('ui-nav');
        t.innerText = CONFIG.header.logo.text; 
        gPC.src = CONFIG.header.logo.gif;
        gM.src = CONFIG.header.logo.gif;
        gPC.onload = () => gPC.style.opacity = "1";
        gM.onload = () => gM.style.opacity = "1";
        n.innerHTML = CONFIG.header.nav.map(i => `<a href="${i.link}" class="fl-nav__link">${i.name}</a>`).join('');
    },
    
    renderLogoPanel() {
        const st = document.getElementById('ui-hero-special-text');
        const cr = document.getElementById('ui-contact-row');
        const hi = document.getElementById('ui-hero-img');
        hi.src = CONFIG.logoPanel.heroImg;
        st.innerText = CONFIG.logoPanel.specialText.text;
        cr.innerHTML = CONFIG.logoPanel.contact.map(l => `<a href="${l.link}" class="fl-gallery-link" ${l.isWeChat ? 'id="trigger-wechat"' : 'target="_blank"'}>${l.name}</a>`).join('');
        ENGINE.initWeChatTrigger();
    },
    
    buildContent() {
        const g = document.getElementById('ui-main-grid');
        g.innerHTML = CONFIG.gallery.items.map(i => {
            const paras = i.paragraphs.map(p => `<p class="fl-paragraph">${p}</p>`).join('');
            return `<div class="fl-item-wrapper fl-reveal" style="grid-column: span ${i.span || 12};"><div class="fl-gallery-text">${paras}</div></div>`;
        }).join('');
    },
    
    resetAllStates() {
        const h = document.getElementById('ui-landing-hero');
        const p = document.getElementById('ui-logo-panel');
        const bg = document.getElementById('ui-header-bg');
        const b = document.body;
        if (h) { h.style.opacity = '0'; h.classList.remove('is-active'); }
        if (p) p.classList.remove('is-panel-pinned');
        if (bg) bg.classList.remove('is-expanded');
        b.classList.remove('is-pin-action', 'has-focus-hover', 'has-panel-focus-hover');
        document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
    },

    showHeroMobile() {
        const h = document.getElementById('ui-landing-hero');
        const p = document.getElementById('ui-logo-panel');
        const st = document.getElementById('ui-hero-special-text');
        const cr = document.getElementById('ui-contact-row');
        const bg = document.getElementById('ui-header-bg');
        const stHeight = st.getBoundingClientRect().height || 21;
        const crHeight = cr.getBoundingClientRect().height || 105; 
        document.documentElement.style.setProperty('--cr-height', `${crHeight}px`);
        document.documentElement.style.setProperty('--bg-height', `${24 + stHeight + 24 + crHeight + 56}px`);
        p.classList.add('is-panel-pinned');
        if (bg) bg.classList.add('is-expanded');
        h.style.opacity = "1"; h.classList.add('is-active');
    },

    showHeroPC(isPin = false) {
        const h = document.getElementById('ui-landing-hero');
        const p = document.getElementById('ui-logo-panel');
        const st = document.getElementById('ui-hero-special-text');
        const cr = document.getElementById('ui-contact-row');
        h.style.width = 'var(--hero-size-pc)'; h.style.height = 'var(--hero-size-pc)';
        h.style.top = 'var(--hero-top-pc)'; 
        const u = window.innerWidth / 12; 
        h.style.left = `${u * CONFIG.heroImage.position.pc.anchorColumn}px`; 
        h.style.transform = 'var(--hero-transform-pc)';
        st.style.left = '4px'; st.style.top = '50%'; st.style.transform = 'translateY(-50%)';
        cr.style.left = '4px'; cr.style.bottom = '12px';
        if (isPin) { p.classList.add('is-panel-pinned'); document.body.classList.add('is-pin-action'); }
        h.style.opacity = "1"; h.classList.add('is-active');
    },

    hideHero() { ENGINE.resetAllStates(); },

    initTriggersAndInteractions() {
        const p = document.getElementById('ui-logo-panel');
        const hero = document.getElementById('ui-landing-hero');
        const lwPC = document.getElementById('ui-logo-gif-wrap-pc');
        const gPC = document.getElementById('ui-logo-gif-pc');
        if (lwPC && gPC) {
            lwPC.onmouseenter = () => { if (window.innerWidth > 768 && !p.classList.contains('is-panel-pinned')) ENGINE.showHeroPC(false); };
            lwPC.onmouseleave = () => { if (window.innerWidth > 768 && !p.classList.contains('is-panel-pinned')) ENGINE.hideHero(); };
            gPC.onclick = (e) => { e.stopPropagation(); if (window.innerWidth <= 768) return; if (hero.classList.contains('is-active') && p.classList.contains('is-panel-pinned')) ENGINE.hideHero(); else ENGINE.showHeroPC(true); };
        }
        const gM = document.getElementById('ui-logo-gif-m');
        if (gM) { gM.onclick = (e) => { e.stopPropagation(); if (window.innerWidth > 768) return; if (hero.classList.contains('is-active')) ENGINE.hideHero(); else ENGINE.showHeroMobile(); }; }
        if (p) { p.onclick = (e) => { if (e.target === p && p.classList.contains('is-panel-pinned')) ENGINE.hideHero(); }; }
    },
    
    initSplash() {
        const s = document.getElementById('ui-splash');
        const st = document.getElementById('ui-splash-text');
        const sb = document.getElementById('ui-splash-bg');
        st.innerText = CONFIG.splash.text;
        sb.style.backgroundImage = `url(${CONFIG.splash.bg})`;
        const d = () => {
            if (!document.body.classList.contains('is-loading')) return;
            s.classList.add('is-finished'); document.body.classList.remove('is-loading');
            sessionStorage.setItem('fl_visited', 'true');
            ENGINE.initReveal();
        };
        if (sessionStorage.getItem('fl_visited')) { document.body.classList.remove('is-loading'); s.classList.add('is-finished'); ENGINE.initReveal(); return; }
        setTimeout(d, 1800); s.onclick = d;
    },
    
    initFocusMode() {
        if (window.innerWidth <= 768) return;
        const b = document.body; const hero = document.getElementById('ui-landing-hero');
        const selA = '.fl-nav__link, .fl-logo__gif-wrap-pc, .fl-reveal';
        const selB = '.fl-nav__link, .fl-logo__gif-wrap-pc, #ui-landing-hero, #ui-hero-special-text, .fl-gallery-link';
        document.addEventListener('mouseover', (e) => { 
            if (b.classList.contains('is-loading') || window.innerWidth <= 768) return;
            const isPanelActive = hero && hero.classList.contains('is-active');
            const target = e.target.closest(isPanelActive ? selB : selA);
            if (target) {
                document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
                b.classList.remove('has-focus-hover', 'has-panel-focus-hover');
                b.classList.add(isPanelActive ? 'has-panel-focus-hover' : 'has-focus-hover');
                target.classList.add('is-hovered-target');
            }
        });
        document.addEventListener('mouseout', (e) => { 
            if (b.classList.contains('is-loading') || window.innerWidth <= 768) return;
            const activeSel = (hero && hero.classList.contains('is-active')) ? selB : selA;
            if (!e.relatedTarget || !e.relatedTarget.closest(activeSel)) {
                b.classList.remove('has-focus-hover', 'has-panel-focus-hover');
                document.querySelectorAll('.is-hovered-target').forEach(el => el.classList.remove('is-hovered-target'));
            }
        });
    },
    
    initReveal() {
        const o = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); o.unobserve(e.target); } }), { threshold: 0.05 });
        document.querySelectorAll('.fl-reveal').forEach(el => o.observe(el));
    },
    
    initWeChatTrigger() {
        const t = document.getElementById('trigger-wechat'); const o = document.getElementById('ui-wechat-overlay');
        if (t && o) { t.onclick = (e) => { e.preventDefault(); o.classList.add('is-active'); }; o.onclick = () => o.classList.remove('is-active'); }
    },
    
    start() {
        ENGINE.applyTypography(); ENGINE.renderHeader(); ENGINE.renderLogoPanel();
        ENGINE.buildContent(); ENGINE.initFocusMode(); ENGINE.initTriggersAndInteractions(); ENGINE.initSplash();
        window.addEventListener('resize', () => { ENGINE.buildContent(); ENGINE.initReveal(); }, { passive: true });
    }
};
window.onload = () => ENGINE.start();
</script>
</body>
</html>
