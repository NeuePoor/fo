<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fooz Portfolio Navigation</title>
<style>
  /* ==============================================
     【小白自定义配置区 - 修改这里即可】
     ==============================================
  */
  :root {
    /* 1. Logo 设置 */
    --logo-video-webm: "https://folio.neuepoor.com/head_chrome.webm"; 
    --logo-video-mp4: "https://folio.neuepoor.com/head_safari.mp4";   
    --logo-height: 48px;          
    --logo-text: "Fooz";          
    --logo-font-size: 32px;       
    --logo-link-url: "/";         

    /* 2. 导航菜单链接文字与地址 */
    --nav-link-1-text: "Works";   
    --nav-link-1-url: "#work";    
    --nav-link-2-text: "(Play)";  
    --nav-link-2-url: "#play";    
    --nav-link-3-text: "Me";      
    --nav-link-3-url: "#me";      

    /* 3. 视觉样式设置 */
    --nav-font-size: 32px;        /* 桌面端导航文字大小 */
    --nav-gap: 40px;              /* 桌面端导航项间距 */
    --mobile-menu-bg: #BABABA;    /* 移动端全屏菜单背景色 */
    --mobile-nav-font-size: 48px; /* 移动端菜单文字大小 */
    
    /* 4. 布局与边距设置 */
    --nav-height: 32px;           
    --side-padding: 8px;          /* 恢复较小的边距，保持精致感 */
    --vertical-padding: 8px;      
    
    --font-family: "Arial", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    
    /* 5. 动画效果 */
    --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);  
  }

  /* ==============================================
     【核心渲染区】
     ==============================================
  */

  body, html {
    margin: 0;
    padding: 0;
    font-family: var(--font-family);
    background: transparent;
  }

  /* 导航栏主容器 */
  .custom-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%; 
    display: flex;
    justify-content: space-between;
    align-items: center; 
    padding: var(--vertical-padding) var(--side-padding); 
    color: #000000; 
    background: transparent;
    box-sizing: border-box;
    z-index: 2000;
    pointer-events: none; /* 允许点击下方内容 */
  }

  .logo-container, .nav-links, .menu-toggle {
    pointer-events: auto; /* 恢复导航元素的交互 */
  }

  .logo-container {
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
    height: var(--logo-height);
  }

  .logo-video {
    height: 100%;
    width: auto;
    display: none; 
    outline: none;
    background: transparent;
    object-fit: contain;
    -webkit-mask-image: -webkit-radial-gradient(white, black);
  }

  .logo-fallback {
    font-weight: bold;
    font-size: var(--logo-font-size);
    letter-spacing: -0.05em;
    line-height: 1;
  }

  .nav-links {
    display: flex;
    gap: var(--nav-gap);
    align-items: center;
  }

  .nav-links a {
    text-decoration: none;
    color: inherit;
    font-size: var(--nav-font-size); 
    font-weight: bold;
    transition: var(--transition);
    line-height: 1;
  }

  /* 响应式汉堡包按钮 */
  .menu-toggle {
    display: none; 
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px;
    width: 44px;
    height: 44px;
    position: relative;
    z-index: 2100;
  }

  .hamburger-box {
    width: 24px;
    height: 18px;
    display: inline-block;
    position: relative;
  }

  .hamburger-inner {
    display: block;
    top: 50%;
    margin-top: -1px;
    width: 24px;
    height: 2px;
    background-color: #000;
    position: absolute;
    transition: var(--transition);
  }

  .hamburger-inner::before, .hamburger-inner::after {
    content: "";
    display: block;
    width: 24px;
    height: 2px;
    background-color: #000;
    position: absolute;
    transition: var(--transition);
  }

  .hamburger-inner::before { top: -8px; }
  .hamburger-inner::after { bottom: -8px; }

  /* 汉堡包动画状态 */
  .is-open .hamburger-inner {
    transform: rotate(45deg);
  }
  .is-open .hamburger-inner::before {
    top: 0;
    opacity: 0;
  }
  .is-open .hamburger-inner::after {
    bottom: 0;
    transform: rotate(-90deg);
  }

  /* 移动端菜单层 */
  .mobile-menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%; 
    height: 100vh; 
    background-color: var(--mobile-menu-bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start; 
    padding: 60px 40px;
    box-sizing: border-box;
    transition: var(--transition);
    z-index: 1900; 
    transform: translateY(-100%);
    visibility: hidden;
    pointer-events: auto;
  }

  .mobile-menu-overlay.is-active {
    transform: translateY(0);
    visibility: visible;
  }

  .mobile-menu-overlay a {
    text-decoration: none;
    color: #000;
    font-size: var(--mobile-nav-font-size);
    font-weight: bold;
    margin-bottom: 24px;
  }

  /* 响应式断点 */
  @media (max-width: 768px) {
    .nav-links { display: none; }
    .menu-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    :root {
      --logo-font-size: 24px;
    }
  }

  /* 预览内容占位 */
  .preview-hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5e5e5;
  }

</style>
</head>
<body>

  <nav class="custom-nav" id="mainNav">
    <a href="/" class="logo-container" id="logoLink">
      <video 
        class="logo-video" 
        id="logoVid" 
        autoplay 
        loop 
        muted 
        playsinline 
        webkit-playsinline
        disablePictureInPicture 
        preload="auto"
      >
        <source id="srcMp4" type='video/mp4; codecs="hvc1"'> 
        <source id="srcWebm" type="video/webm">
      </video>
      <span class="logo-fallback" id="fallbackText">Fooz</span>
    </a>
    
    <div class="nav-links">
      <a href="#work" id="nav1">Works</a>
      <a href="#play" id="nav2">(Play)</a>
      <a href="#me" id="nav3">Me</a>
    </div>

    <button class="menu-toggle" id="menuBtn" onclick="toggleMenu()">
      <span class="hamburger-box">
        <span class="hamburger-inner"></span>
      </span>
    </button>
  </nav>

  <div class="mobile-menu-overlay" id="mobileMenu">
    <a href="#work" id="mobNav1" onclick="toggleMenu()">Works</a>
    <a href="#play" id="mobNav2" onclick="toggleMenu()">(Play)</a>
    <a href="#me" id="mobNav3" onclick="toggleMenu()">Me</a>
  </div>

  <section class="preview-hero">
    <div style="text-align: center;">
      <h1>响应式导航已恢复</h1>
      <p>尝试缩小窗口宽度以查看移动端汉堡包菜单。</p>
    </div>
  </section>

  <script>
    let isMenuOpen = false;

    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      const btn = document.getElementById('menuBtn');
      isMenuOpen = !isMenuOpen;
      
      if (isMenuOpen) {
        menu.classList.add('is-active');
        btn.classList.add('is-open');
        document.body.style.overflow = 'hidden'; // 开启菜单时禁止页面滚动
      } else {
        menu.classList.remove('is-active');
        btn.classList.remove('is-open');
        document.body.style.overflow = ''; 
      }
    }

    function initNav() {
      const root = document.documentElement;
      const getVar = (name) => getComputedStyle(root).getPropertyValue(name).replace(/"/g, '').trim();
      
      // 动态同步配置区的链接和文字
      const logoLink = document.getElementById('logoLink');
      const linkUrl = getVar('--logo-link-url');
      if (linkUrl) logoLink.href = linkUrl;

      document.getElementById('fallbackText').textContent = getVar('--logo-text');
      
      const navItems = [
        {id: 'nav1', mobId: 'mobNav1', textVar: '--nav-link-1-text', urlVar: '--nav-link-1-url'},
        {id: 'nav2', mobId: 'mobNav2', textVar: '--nav-link-2-text', urlVar: '--nav-link-2-url'},
        {id: 'nav3', mobId: 'mobNav3', textVar: '--nav-link-3-text', urlVar: '--nav-link-3-url'}
      ];

      navItems.forEach(item => {
        const text = getVar(item.textVar);
        const url = getVar(item.urlVar);
        const el = document.getElementById(item.id);
        const mobEl = document.getElementById(item.mobId);
        if (el) { el.textContent = text; el.href = url; }
        if (mobEl) { mobEl.textContent = text; mobEl.href = url; }
      });

      // 视频加载与 Fallback 逻辑
      const video = document.getElementById('logoVid');
      const fallback = document.getElementById('fallbackText');
      const webmSrc = getVar('--logo-video-webm');
      const mp4Src = getVar('--logo-video-mp4');

      if (webmSrc || mp4Src) {
        document.getElementById('srcMp4').src = mp4Src;
        document.getElementById('srcWebm').src = webmSrc;
        video.load();
        
        video.oncanplay = () => {
          video.style.display = 'block';
          fallback.style.display = 'none';
        };

        video.onerror = () => {
          video.style.display = 'none';
          fallback.style.display = 'block';
        };
      }
    }

    // 页面载入初始化
    document.addEventListener('DOMContentLoaded', initNav);

    // 窗口尺寸变化处理
    window.addEventListener('resize', () => {
      if (window.innerWidth > 768 && isMenuOpen) {
        toggleMenu(); // 切换回桌面端时自动关闭移动菜单
      }
    });
  </script>
</body>
</html>
